import os

html_content = """<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>30 Seconds - HEAO '96 Edition</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .pulse-fast { animation: pulse 0.5s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-rose-500 selection:text-white">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Default initial word list with HEAO '96 & Trip memories
        const INITIAL_WORDS = [
            "Gran Dorado '96", "El Campello", "Split", "Krakau", "Lissabon",
            "Resort Arcen", "Texel", "Ameland", "Berlijn", "Huis van Ronald",
            "Greg", "Tinka", "Nathalie", "Richard", "Nancy", "Remco", "Ronald", "Petra",
            "Maltipoo JJ", "Zoetermeer", "Oosterheem", "Salesforce", "HEAO Audit",
            "Lotus 1-2-3", "3.5 inch Diskette", "Guldens", "Friends Theme", "Peterson Tuner",
            "Cali76 Compressor", "HX Stomp XL", "Boss OC-2", "Bass Synth MB301", "Fender Jazz Bass",
            "Overkapping", "Sproeibeurt", "Home Assistant", "Tesla Model Y", "Borreluur",
            "Reünie 30 Jaar", "Pubquiz", "VHS Band", "Brugjaar VWO", "HMC Rotterdam",
            "Landal Lommerbergen", "Designer Outlet", "Public Sector", "DICTU", "Car Allowance"
        ];

        function App() {
            // Screen States: 'setup', 'word_editor', 'turn_start', 'playing', 'turn_summary', 'game_over'
            const [screen, setScreen] = useState('setup');
            
            // Game Configuration
            const [timerLength, setTimerLength] = useState(30);
            const [targetScore, setTargetScore] = useState(30);
            const [teams, setTeams] = useState([
                { id: 1, name: 'Team 1 (Greg & Co)', score: 0 },
                { id: 2, name: 'Team 2 (Ronald & Co)', score: 0 }
            ]);
            const [wordList, setWordList] = useState(() => {
                const saved = localStorage.getItem('heao96_words');
                return saved ? JSON.parse(saved) : INITIAL_WORDS;
            });
            const [newWord, setNewWord] = useState('');

            // Game Play State
            const [currentTeamIdx, setCurrentTeamIdx] = useState(0);
            const [currentWords, setCurrentWords] = useState([]);
            const [checkedWords, setCheckedWords] = useState([false, false, false, false, false]);
            const [timeLeft, setTimeLeft] = useState(30);
            const [isTimerRunning, setIsTimerRunning] = useState(false);
            const [usedWords, setUsedWords] = useState([]);
            const [roundScore, setRoundScore] = useState(0);

            // Audio synth for beep
            const playBeep = (freq = 440, type = 'sine', duration = 0.1) => {
                try {
                    const ctx = new (window.AudioContext || window.webkitAudioContext)();
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = type;
                    osc.frequency.value = freq;
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    gain.gain.exponentialRampToValueAtTime(0.00001, ctx.currentTime + duration);
                    osc.stop(ctx.currentTime + duration);
                } catch(e) {}
            };

            // Save Word List locally
            useEffect(() => {
                localStorage.setItem('heao96_words', JSON.stringify(wordList));
            }, [wordList]);

            // Timer Tick Effect
            useEffect(() => {
                let interval = null;
                if (isTimerRunning && timeLeft > 0) {
                    interval = setInterval(() => {
                        setTimeLeft(t => {
                            if (t <= 5 && t > 1) playBeep(600, 'square', 0.08);
                            if (t === 1) playBeep(880, 'square', 0.3);
                            return t - 1;
                        });
                    }, 1000);
                } else if (timeLeft === 0 && isTimerRunning) {
                    setIsTimerRunning(false);
                    setScreen('turn_summary');
                }
                return () => clearInterval(interval);
            }, [isTimerRunning, timeLeft]);

            // Pick 5 unique unplayed words
            const pickNextWords = () => {
                let available = wordList.filter(w => !usedWords.includes(w));
                if (available.length < 5) {
                    setUsedWords([]); // reset played words if exhausted
                    available = [...wordList];
                }
                const shuffled = [...available].sort(() => 0.5 - Math.random());
                const selected = shuffled.slice(0, 5);
                setCurrentWords(selected);
                setUsedWords(prev => [...prev, ...selected]);
                setCheckedWords([false, false, false, false, false]);
            };

            // Handlers
            const handleAddTeam = () => {
                setTeams([...teams, { id: Date.now(), name: `Team ${teams.length + 1}`, score: 0 }]);
            };

            const handleRemoveTeam = (id) => {
                if (teams.length > 2) {
                    setTeams(teams.filter(t => t.id !== id));
                }
            };

            const handleUpdateTeamName = (id, newName) => {
                setTeams(teams.map(t => t.id === id ? { ...t, name: newName } : t));
            };

            const handleAddWord = (e) => {
                e.preventDefault();
                if (newWord.trim() && !wordList.includes(newWord.trim())) {
                    setWordList([...wordList, newWord.trim()]);
                    setNewWord('');
                }
            };

            const handleRemoveWord = (wordToRemove) => {
                setWordList(wordList.filter(w => w !== wordToRemove));
            };

            const handleStartTurn = () => {
                pickNextWords();
                setTimeLeft(timerLength);
                setScreen('turn_start');
            };

            const handleBeginTimer = () => {
                setScreen('playing');
                setIsTimerRunning(true);
            };

            const toggleCheckWord = (idx) => {
                const next = [...checkedWords];
                next[idx] = !next[idx];
                setCheckedWords(next);
            };

            const handleFinishTurn = () => {
                const score = checkedWords.filter(Boolean).length;
                setRoundScore(score);
                
                // Update team score
                const updatedTeams = [...teams];
                updatedTeams[currentTeamIdx].score += score;
                setTeams(updatedTeams);

                // Check winner
                if (updatedTeams[currentTeamIdx].score >= targetScore) {
                    setScreen('game_over');
                } else {
                    setScreen('turn_summary');
                }
            };

            const handleNextTeam = () => {
                setCurrentTeamIdx((currentTeamIdx + 1) % teams.length);
                handleStartTurn();
            };

            const handleExportWords = () => {
                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(wordList));
                const downloadAnchor = document.createElement('a');
                downloadAnchor.setAttribute("href", dataStr);
                downloadAnchor.setAttribute("download", "heao96_30seconds_words.json");
                document.body.appendChild(downloadAnchor);
                downloadAnchor.click();
                downloadAnchor.remove();
            };

            const handleImportWords = (event) => {
                const fileReader = new FileReader();
                fileReader.onload = (e) => {
                    try {
                        const parsed = JSON.parse(e.target.result);
                        if (Array.isArray(parsed)) setWordList(parsed);
                    } catch(err) {
                        alert("Ongeldig JSON bestand.");
                    }
                };
                if (event.target.files[0]) {
                    fileReader.readAsText(event.target.files[0]);
                }
            };

            return (
                <div class="max-w-md mx-auto w-full min-h-screen flex flex-col p-4">
                    {/* Header */}
                    <header class="flex justify-between items-center py-3 border-b border-slate-800 mb-4">
                        <div class="flex items-center space-x-2">
                            <span class="bg-rose-600 text-white font-extrabold text-xs px-2 py-1 rounded">30 SEC</span>
                            <h1 class="font-bold text-lg text-slate-100 tracking-tight">HEAO '96 Edition</h1>
                        </div>
                        {screen === 'setup' && (
                            <button onClick={() => setScreen('word_editor')} class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 py-1.5 px-3 rounded-lg border border-slate-700 font-medium">
                                Woordenboek ({wordList.length})
                            </button>
                        )}
                    </header>

                    {/* SCREEN: SETUP */}
                    {screen === 'setup' && (
                        <div class="flex-1 flex flex-col justify-between space-y-6">
                            <div class="space-y-5">
                                {/* Teams Section */}
                                <div class="bg-slate-800/60 p-4 rounded-xl border border-slate-700/50">
                                    <h2 class="text-xs font-semibold text-rose-400 uppercase tracking-wider mb-3">Teams Invoeren</h2>
                                    <div class="space-y-2">
                                        {teams.map((team, idx) => (
                                            <div key={team.id} class="flex items-center space-x-2">
                                                <input
                                                    type="text"
                                                    value={team.name}
                                                    onChange={(e) => handleUpdateTeamName(team.id, e.target.value)}
                                                    class="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-rose-500"
                                                />
                                                {teams.length > 2 && (
                                                    <button onClick={() => handleRemoveTeam(team.id)} class="text-slate-500 hover:text-rose-400 p-2">✕</button>
                                                )}
                                            </div>
                                        ))}
                                    </div>
                                    <button onClick={handleAddTeam} class="mt-3 text-xs text-rose-400 font-semibold hover:underline flex items-center">
                                        + Team Toevoegen
                                    </button>
                                </div>

                                {/* Settings Section */}
                                <div class="bg-slate-800/60 p-4 rounded-xl border border-slate-700/50 space-y-4">
                                    <h2 class="text-xs font-semibold text-rose-400 uppercase tracking-wider mb-2">Spelinstellingen</h2>
                                    <div class="flex justify-between items-center">
                                        <span class="text-sm text-slate-300">Timer Duur (Seconden)</span>
                                        <input
                                            type="number"
                                            value={timerLength}
                                            onChange={(e) => setTimerLength(Number(e.target.value))}
                                            class="w-20 bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-center text-sm font-semibold text-slate-100"
                                        />
                                    </div>
                                    <div class="flex justify-between items-center">
                                        <span class="text-sm text-slate-300">Streefscore (Punten)</span>
                                        <input
                                            type="number"
                                            value={targetScore}
                                            onChange={(e) => setTargetScore(Number(e.target.value))}
                                            class="w-20 bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-center text-sm font-semibold text-slate-100"
                                        />
                                    </div>
                                </div>
                            </div>

                            <button
                                onClick={handleStartTurn}
                                class="w-full bg-rose-600 hover:bg-rose-500 text-white font-bold py-3.5 rounded-xl text-center shadow-lg shadow-rose-900/40 active:scale-95 transition"
                            >
                                Start Het Spel! 🚀
                            </button>
                        </div>
                    )}

                    {/* SCREEN: WORD EDITOR */}
                    {screen === 'word_editor' && (
                        <div class="flex-1 flex flex-col justify-between">
                            <div>
                                <div class="flex justify-between items-center mb-4">
                                    <h2 class="font-bold text-slate-200">Eigen Woordenboek ({wordList.length})</h2>
                                    <button onClick={() => setScreen('setup')} class="text-xs text-slate-400 hover:text-slate-200">← Terug naar Setup</button>
                                </div>

                                {/* Add Word Form */}
                                <form onSubmit={handleAddWord} class="flex space-x-2 mb-4">
                                    <input
                                        type="text"
                                        placeholder="Nieuw HEAO / Vakantie woord..."
                                        value={newWord}
                                        onChange={(e) => setNewWord(e.target.value)}
                                        class="flex-1 bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-rose-500"
                                    />
                                    <button type="submit" class="bg-rose-600 text-white text-sm font-bold px-4 py-2 rounded-lg">Toevoegen</button>
                                </form>

                                {/* Words List */}
                                <div class="max-h-80 overflow-y-auto space-y-1.5 pr-1 mb-4 border border-slate-800 rounded-lg p-2 bg-slate-950/40">
                                    {wordList.map((word, idx) => (
                                        <div key={idx} class="flex justify-between items-center bg-slate-800/80 px-3 py-2 rounded text-sm text-slate-200">
                                            <span>{word}</span>
                                            <button onClick={() => handleRemoveWord(word)} class="text-slate-500 hover:text-rose-400 text-xs font-bold">✕</button>
                                        </div>
                                    ))}
                                </div>
                            </div>

                            {/* Import/Export */}
                            <div class="space-y-2">
                                <div class="flex space-x-2">
                                    <button onClick={handleExportWords} class="flex-1 bg-slate-800 text-slate-300 py-2 rounded-lg text-xs font-semibold border border-slate-700">
                                        Exporteer (.JSON)
                                    </button>
                                    <label class="flex-1 bg-slate-800 text-slate-300 py-2 rounded-lg text-xs font-semibold border border-slate-700 text-center cursor-pointer">
                                        Importeer (.JSON)
                                        <input type="file" accept=".json" onChange={handleImportWords} class="hidden" />
                                    </label>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* SCREEN: TURN START */}
                    {screen === 'turn_start' && (
                        <div class="flex-1 flex flex-col justify-center items-center text-center space-y-6">
                            <div class="bg-slate-800/50 p-6 rounded-2xl border border-slate-700/50 w-full">
                                <p class="text-xs text-rose-400 font-bold uppercase tracking-widest mb-1">Aan de beurt</p>
                                <h2 class="text-2xl font-extrabold text-white mb-2">{teams[currentTeamIdx].name}</h2>
                                <p class="text-sm text-slate-400">Huidige score: <span class="font-bold text-slate-200">{teams[currentTeamIdx].score}</span> / {targetScore} ptn</p>
                            </div>

                            <div class="text-slate-400 text-xs px-6">
                                Zorg dat de omschrijver de telefoon vasthoudt. Zodra je op "START TIMER" klikt lopen de 30 seconden direct!
                            </div>

                            <button
                                onClick={handleBeginTimer}
                                class="w-full bg-rose-600 hover:bg-rose-500 text-white font-bold py-4 rounded-xl text-lg shadow-xl shadow-rose-900/50 active:scale-95 transition"
                            >
                                START TIMER ⏱️
                            </button>
                        </div>
                    )}

                    {/* SCREEN: PLAYING */}
                    {screen === 'playing' && (
                        <div class="flex-1 flex flex-col justify-between">
                            {/* Timer Display */}
                            <div class="flex justify-between items-center bg-slate-800/80 p-3 rounded-xl border border-slate-700 mb-4">
                                <div>
                                    <p class="text-xs text-slate-400">{teams[currentTeamIdx].name}</p>
                                    <p class="text-xs text-rose-400 font-bold">Vink aan wat geraden is!</p>
                                </div>
                                <div class={`text-3xl font-black font-mono px-4 py-1 rounded-lg ${timeLeft <= 5 ? 'bg-rose-600 text-white pulse-fast' : 'bg-slate-900 text-rose-400 border border-slate-700'}`}>
                                    {timeLeft}s
                                </div>
                            </div>

                            {/* 5 Words Card List */}
                            <div class="space-y-2.5 my-auto">
                                {currentWords.map((word, idx) => (
                                    <button
                                        key={idx}
                                        onClick={() => toggleCheckWord(idx)}
                                        class={`w-full p-3.5 rounded-xl text-left font-bold text-base transition flex justify-between items-center border ${
                                            checkedWords[idx]
                                                ? 'bg-emerald-950/80 border-emerald-500 text-emerald-200 shadow-md shadow-emerald-950'
                                                : 'bg-slate-800 border-slate-700 text-slate-100 hover:bg-slate-750'
                                        }`}
                                    >
                                        <span>{word}</span>
                                        <span class={`w-6 h-6 rounded-full flex items-center justify-center text-xs font-black ${
                                            checkedWords[idx] ? 'bg-emerald-500 text-slate-950' : 'border-2 border-slate-600'
                                        }`}>
                                            {checkedWords[idx] ? '✓' : ''}
                                        </span>
                                    </button>
                                ))}
                            </div>

                            {/* Controls */}
                            <div class="mt-4 pt-2">
                                <button
                                    onClick={handleFinishTurn}
                                    class="w-full bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold py-3 rounded-xl border border-slate-600"
                                >
                                    Ronde Nu Afronden ➔
                                </button>
                            </div>
                        </div>
                    )}

                    {/* SCREEN: TURN SUMMARY */}
                    {screen === 'turn_summary' && (
                        <div class="flex-1 flex flex-col justify-between">
                            <div class="text-center my-auto space-y-4">
                                <div class="inline-block bg-rose-950/60 border border-rose-800 p-4 rounded-full">
                                    <span class="text-4xl">🎉</span>
                                </div>
                                <h2 class="text-xl font-bold text-slate-100">Ronde Afgelopen!</h2>
                                <p class="text-slate-300 text-sm">
                                    <span class="font-bold text-rose-400">{teams[currentTeamIdx].name}</span> heeft <span class="font-extrabold text-white text-lg">{checkedWords.filter(Boolean).length}</span> punten gescoord deze ronde!
                                </p>

                                {/* Leaderboard */}
                                <div class="bg-slate-800/60 p-4 rounded-xl border border-slate-700 text-left space-y-2 mt-4">
                                    <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Tussenstand</h3>
                                    {teams.map((t, idx) => (
                                        <div key={t.id} class={`flex justify-between py-1.5 px-2 rounded ${idx === currentTeamIdx ? 'bg-slate-700/50 font-bold text-white' : 'text-slate-300'}`}>
                                            <span>{t.name}</span>
                                            <span class="font-mono text-rose-400">{t.score} ptn</span>
                                        </div>
                                    ))}
                                </div>
                            </div>

                            <button
                                onClick={handleNextTeam}
                                class="w-full bg-rose-600 hover:bg-rose-500 text-white font-bold py-3.5 rounded-xl text-center shadow-lg active:scale-95 transition"
                            >
                                Volgende Team Aan De Beurt ➔
                            </button>
                        </div>
                    )}

                    {/* SCREEN: GAME OVER */}
                    {screen === 'game_over' && (
                        <div class="flex-1 flex flex-col justify-center items-center text-center space-y-6">
                            <div class="text-6xl">🏆</div>
                            <div>
                                <h2 class="text-2xl font-black text-white">GEFELICITEERD!</h2>
                                <p class="text-rose-400 font-bold text-lg mt-1">{teams[currentTeamIdx].name}</p>
                                <p class="text-xs text-slate-400 mt-2">Heeft de streefscore van {targetScore} punten gehaald!</p>
                            </div>

                            <button
                                onClick={() => {
                                    setTeams(teams.map(t => ({ ...t, score: 0 })));
                                    setScreen('setup');
                                }}
                                class="w-full bg-rose-600 hover:bg-rose-500 text-white font-bold py-3.5 rounded-xl"
                            >
                                Nieuw Spel Starten 🔄
                            </button>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
"""

output_path = "heao96_30seconds_app.html"
with open(output_path, "w", encoding="utf-8") as f:
    f.write(html_content)

print(f"File successfully created: {output_path}")
