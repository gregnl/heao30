<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HEAO-30 - Build 23</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
        }
        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4 max-w-md mx-auto">

    <!-- Header -->
    <header class="text-center my-4">
        <h1 class="text-3xl font-extrabold tracking-tight text-indigo-400">HEAO-30</h1>
        <p class="text-xs text-slate-400 mt-1">Build 23 &bull; Max. 4 Teams</p>
    </header>

    <!-- Main Content Container -->
    <main class="space-y-6">

        <!-- Team Setup Section -->
        <section class="glass-panel p-5 rounded-2xl shadow-xl">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-bold text-slate-200">Teams</h2>
                <span id="team-count-info" class="text-xs font-semibold px-2.5 py-1 rounded-full bg-slate-700 text-indigo-300">
                    Teams: 0/4
                </span>
            </div>

            <!-- Team Input Form -->
            <div class="flex gap-2 mb-4">
                <input 
                    type="text" 
                    id="team-input" 
                    placeholder="Naam van team..." 
                    class="flex-1 bg-slate-800/80 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition-colors"
                    maxlength="20"
                >
                <button 
                    id="btn-add-team" 
                    onclick="handleAddTeam()" 
                    class="bg-indigo-600 hover:bg-indigo-500 disabled:opacity-40 disabled:hover:bg-indigo-600 disabled:cursor-not-allowed text-white font-medium px-4 py-2.5 rounded-xl text-sm transition-all flex items-center justify-center min-w-[90px]"
                >
                    + Voeg toe
                </button>
            </div>

            <!-- Team List -->
            <ul id="team-list" class="space-y-2">
                <!-- Dynamically populated teams -->
            </ul>
        </section>

        <!-- Device Info Banner (Discreet) -->
        <section class="glass-panel p-3 rounded-xl flex items-center justify-between text-xs text-slate-400">
            <span id="device-info-text">Detecteren...</span>
            <span id="pwa-status" class="px-2 py-0.5 rounded bg-slate-800 text-slate-300">Web</span>
        </section>

    </main>

    <!-- Footer -->
    <footer class="text-center text-xs text-slate-500 py-4">
        HEAO-30 &copy; 2026 &bull; Build 23
    </footer>

    <!-- Application Script -->
    <script>
        const MAX_TEAMS = 4;
        let teams = [];

        // Helper: Get basic device info
        function getDeviceInfo() {
            const ua = navigator.userAgent;
            let device = "Desktop Client";
            if (/iPhone/i.test(ua)) device = "iPhone (iOS)";
            else if (/iPad/i.test(ua)) device = "iPad (iOS)";
            else if (/Android/i.test(ua)) device = "Android Device";
            else if (/Macintosh/i.test(ua)) device = "Mac";
            else if (/Windows/i.test(ua)) device = "Windows PC";
            return device;
        }

        // Initialize UI
        document.addEventListener("DOMContentLoaded", () => {
            // Set device info
            document.getElementById('device-info-text').textContent = getDeviceInfo();
            
            // Check standalone (PWA) status
            const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
            if (isStandalone) {
                const pwaBadge = document.getElementById('pwa-status');
                pwaBadge.textContent = 'PWA App';
                pwaBadge.classList.replace('bg-slate-800', 'bg-emerald-900/60');
                pwaBadge.classList.replace('text-slate-300', 'text-emerald-300');
            }

            // Allow Enter key in input field
            document.getElementById('team-input').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') handleAddTeam();
            });

            updateTeamsUI();
        });

        function handleAddTeam() {
            const input = document.getElementById('team-input');
            const teamName = input.value.trim();

            if (teams.length >= MAX_TEAMS) {
                alert(`Er kunnen maximaal ${MAX_TEAMS} teams meedoen.`);
                return;
            }

            const finalName = teamName || `Team ${teams.length + 1}`;
            
            teams.push({
                id: Date.now(),
                name: finalName,
                score: 0
            });

            input.value = '';
            input.focus();
            updateTeamsUI();
        }

        function removeTeam(id) {
            teams = teams.filter(team => team.id !== id);
            updateTeamsUI();
        }

        function updateTeamsUI() {
            const teamList = document.getElementById('team-list');
            const addTeamBtn = document.getElementById('btn-add-team');
            const teamInput = document.getElementById('team-input');
            const teamCountInfo = document.getElementById('team-count-info');

            // Update Counter
            teamCountInfo.textContent = `Teams: ${teams.length}/${MAX_TEAMS}`;

            // Handle Max Limit UI State
            if (teams.length >= MAX_TEAMS) {
                addTeamBtn.disabled = true;
                teamInput.disabled = true;
                teamInput.placeholder = "Max. 4 teams bereikt";
            } else {
                addTeamBtn.disabled = false;
                teamInput.disabled = false;
                teamInput.placeholder = "Naam van team...";
            }

            // Render Team Items
            if (teams.length === 0) {
                teamList.innerHTML = `<li class="text-center text-slate-500 text-xs py-4 italic">Nog geen teams toegevoegd (max. 4)</li>`;
                return;
            }

            teamList.innerHTML = teams.map((team, index) => `
                <li class="flex items-center justify-between bg-slate-800/60 border border-slate-700/50 rounded-xl p-3 text-sm">
                    <span class="font-medium text-slate-200">
                        <span class="text-indigo-400 font-bold mr-2">${index + 1}.</span>${escapeHtml(team.name)}
                    </span>
                    <button onclick="removeTeam(${team.id})" class="text-slate-400 hover:text-rose-400 transition-colors px-2 py-1">
                        &times;
                    </button>
                </li>
            `).join('');
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
        }
    </script>
</body>
</html>
