<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>30 Seconds - HEAO '96 Edition</title>
    
    <!-- PWA / Standalone App meta tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="30 Seconds">
    <link rel="manifest" href='data:application/manifest+json,{"name":"30 Seconds HEAO","short_name":"30Sec","start_url":".","display":"standalone","background_color":"#0f172a","theme_color":"#0f172a"}'>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap');
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .pulse-fast { animation: pulse 0.5s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }
        
        .fade-out {
            animation: fadeOut 0.4s ease-in-out forwards;
        }
        @keyframes fadeOut {
            from { opacity: 1; visibility: visible; }
            to { opacity: 0; visibility: hidden; }
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 h-screen h-dvh max-h-dvh overflow-hidden selection:bg-rose-500 selection:text-white">

    <div id="root" class="h-full w-full"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const INITIAL_WORDS = [
      "Ameland",
            "Berlijn",
            "Voorborrelen",
            "El Campello",
            "Gran Dorado",
            "Greg",
            "Gulden",
            "HEAO",
            "Krakau",
            "Lommerbergen",
            "Lissabon",
            "Nancy",
            "Nathalie",
            "Oosterheem",
            "Petra",
            "Remco",
            "Resort Arcen",
            "Richard",
            "Ronald",
            "Split",
            "Sproeipoes",
            "Texel",
            "Tinka",
            "Zoetermeer",
            "Robert Klein",
            "Robert Molenkamp",
            "Cissy",
            "Konijn",
            "Supermarkt op wielen",
            "Koffie Inferno",
            "Saunahuisje",
            "Paintballen",
            "Zwembad",
            "Ommen",
            "Sexen",
            "Nagelkerke",
            "Nervilijn",
            "Wham",
            "Maffia",
            "Scouting",
            "Stuurgroep",
            "Windstiltegebied",
            "Squirten",
            "69",
            "Casino",
            "Heidenroosjes",
            "Spuithoer",
            "Wil je me eitje zien?",
            "Jiskefet",
            "Emiel",
            "Sletvana",
            "Mexico",
            "Le Chevre"
        ];

        const INITIAL_TEAMS = [
            { id: 1, name: 'Team 1 (Greg & Co)', score: 0 },
            { id: 2, name: 'Team 2 (Ronald & Co)', score: 0 }
        ];

        const sortAlphabetically = (words) => {
            return [...words].sort((a, b) => a.localeCompare(b, 'nl', { sensitivity: 'base' }));
        };

        function App() {
            // Splash screen state
            const [showSplash, setShowSplash] = useState(true);
            const [splashFading, setSplashFading] = useState(false);

            const [screen, setScreen] = useState('setup');
            const [timerLength, setTimerLength] = useState(30);
            const [targetScore, setTargetScore] = useState(30);
            
            const [teams, setTeams] = useState(() => {
                const saved = localStorage.getItem('heao96_teams');
                return saved ? JSON.parse(saved) : INITIAL_TEAMS;
            });

            const [wordList, setWordList] = useState(() => {
                const saved = localStorage.getItem('heao96_words');
                const list = saved ? JSON.parse(saved) : INITIAL_WORDS;
                return sortAlphabetically(list);
            });

            const [newWord, setNewWord] = useState('');

            const [currentTeamIdx, setCurrentTeamIdx] = useState(0);
            const [currentWords, setCurrentWords] = useState([]);
            const [checkedWords, setCheckedWords] = useState([false, false, false, false, false]);
            const [timeLeft, setTimeLeft] = useState(30);
            const [isTimerRunning, setIsTimerRunning] = useState(false);
            const [usedWords, setUsedWords] = useState([]);
            const [roundScore, setRoundScore] = useState(0);

            // Tik-om-verder te gaan op het Splash Screen
            const handleSplashClick = () => {
                if (splashFading) return;
                setSplashFading(true);
                setTimeout(() => setShowSplash(false), 400);
            };

            const playBeep = (freq = 440, type = 'sine', duration = 0.1) => {
                try {
                    const ctx = new (window.AudioContext || window.webkitAudioContext)();
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = type;
                    osc.frequency.value = freq;
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    gain.gain.exponentialRampToValueAtTime(0.00001, ctx.currentTime + duration);
                    osc.stop(ctx.currentTime + duration);
                } catch(e) {}
            };

            useEffect(() => {
                localStorage.setItem('heao96_words', JSON.stringify(wordList));
            }, [wordList]);

            useEffect(() => {
                localStorage.setItem('heao96_teams', JSON.stringify(teams));
            }, [teams]);

            useEffect(() => {
                let interval = null;
                if (isTimerRunning && timeLeft > 0) {
                    interval = setInterval(() => {
                        setTimeLeft(t => {
                            if (t <= 5 && t > 1) playBeep(600, 'square', 0.08);
                            if (t === 1) playBeep(880, 'square', 0.3);
                            return t - 1;
                        });
                    }, 1000);
                } else if (timeLeft === 0 && isTimerRunning) {
                    setIsTimerRunning(false);
                    setScreen('turn_summary');
                }
                return () => clearInterval(interval);
            }, [isTimerRunning, timeLeft]);

            const pickNextWords = () => {
                let available = wordList.filter(w => !usedWords.includes(w));
                if (available.length < 5) {
                    setUsedWords([]);
                    available = [...wordList];
                }
                const shuffled = [...available].sort(() => 0.5 - Math.random());
                const selected = shuffled.slice(0, 5);
                setCurrentWords(selected);
                setUsedWords(prev => [...prev, ...selected]);
                setCheckedWords([false, false, false, false, false]);
            };

            const handleAbortGame = () => {
                if (confirm("Weet je zeker dat je de huidige ronde wilt afbreken en terug wilt naar het menu?")) {
                    setIsTimerRunning(false);
                    setScreen('setup');
                }
            };

            const handleAddTeam = () => {
                setTeams([...teams, { id: Date.now(), name: `Team ${teams.length + 1}`, score: 0 }]);
            };

            const handleRemoveTeam = (id) => {
                if (teams.length > 2) {
                    setTeams(teams.filter(t => t.id !== id));
                }
            };

            const handleUpdateTeamName = (id, newName) => {
                setTeams(teams.map(t => t.id === id ? { ...t, name: newName } : t));
            };

            const handleAddWord = (e) => {
                e.preventDefault();
                if (newWord.trim() && !wordList.includes(newWord.trim())) {
                    const updated = sortAlphabetically([...wordList, newWord.trim()]);
                    setWordList(updated);
                    setNewWord('');
                }
            };

            const handleRemoveWord = (wordToRemove) => {
                setWordList(wordList.filter(w => w !== wordToRemove));
            };

            // RESET KNOP LOGICA
            const handleResetToDefaultWords = () => {
                if (confirm("Weet je zeker dat je de woordenlijst wilt herstellen naar de standaardlijst uit de code? Eigen toevoegingen worden gewist.")) {
                    const defaultSorted = sortAlphabetically(INITIAL_WORDS);
                    setWordList(defaultSorted);
                    localStorage.setItem('heao96_words', JSON.stringify(defaultSorted));
                }
            };

            const handleStartTurn = () => {
                pickNextWords();
                setTimeLeft(timerLength);
                setScreen('turn_start');
            };

            const handleBeginTimer = () => {
                setScreen('playing');
                setIsTimerRunning(true);
            };

            const toggleCheckWord = (idx) => {
                const next = [...checkedWords];
                next[idx] = !next[idx];
                setCheckedWords(next);
            };

            const handleFinishTurn = () => {
                const score = checkedWords.filter(Boolean).length;
                setRoundScore(score);
                
                const updatedTeams = [...teams];
                updatedTeams[currentTeamIdx].score += score;
                setTeams(updatedTeams);

                if (updatedTeams[currentTeamIdx].score >= targetScore) {
                    setScreen('game_over');
                } else {
                    setScreen('turn_summary');
                }
            };

            const handleNextTeam = () => {
                setCurrentTeamIdx((currentTeamIdx + 1) % teams.length);
                handleStartTurn();
            };

            const handleExportWords = () => {
                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(wordList));
                const downloadAnchor = document.createElement('a');
                downloadAnchor.setAttribute("href", dataStr);
                downloadAnchor.setAttribute("download", "heao96_30seconds_words.json");
                document.body.appendChild(downloadAnchor);
                downloadAnchor.click();
                downloadAnchor.remove();
            };

            const handleImportWords = (event) => {
                const fileReader = new FileReader();
                fileReader.onload = (e) => {
                    try {
                        const parsed = JSON.parse(e.target.result);
                        if (Array.isArray(parsed)) setWordList(sortAlphabetically(parsed));
                    } catch(err) {
                        alert("Ongeldig JSON bestand.");
                    }
                };
                if (event.target.files[0]) {
                    fileReader.readAsText(event.target.files[0]);
                }
            };

            return (
                <div class="relative max-w-md mx-auto w-full h-full flex flex-col p-4 justify-between bg-slate-900">
                    
                    {/* SPLASH SCREEN (TIK OM VERDER TE GAAN) */}
                    {showSplash && (
                        <div 
                            onClick={handleSplashClick} 
                            class={`fixed inset-0 z-50 bg-slate-950 flex flex-col items-center justify-between p-8 text-center select-none cursor-pointer ${splashFading ? 'fade-out' : ''}`}
                        >
                            <div class="w-full"></div>

                            <div class="flex flex-col items-center justify-center">
                                {/* Logo Graphic */}
                                <div class="relative w-48 h-48 mb-8 flex items-center justify-center">
                                    <div class="absolute w-28 h-36 bg-sky-400 rounded-xl transform -rotate-12 translate-x-[-15px] translate-y-[-5px] shadow-2xl border-2 border-sky-300"></div>
                                    <div class="absolute w-28 h-36 bg-amber-400 rounded-xl transform rotate-6 translate-x-[15px] translate-y-[-10px] shadow-2xl border-2 border-amber-300"></div>
                                    
                                    <div class="absolute z-10 flex flex-col items-center justify-center pt-2">
                                        <div class="flex space-x-6 mb-3">
                                            <div class="w-8 h-2 bg-slate-950 rounded-full transform rotate-12"></div>
                                            <div class="w-8 h-2 bg-slate-950 rounded-full transform -rotate-12"></div>
                                        </div>
                                        <div class="w-24 h-12 border-b-8 border-slate-950 rounded-b-full"></div>
                                    </div>
                                </div>

                                {/* Logo Tekst */}
                                <div class="space-y-1">
                                    <h1 class="text-4xl font-black tracking-wider text-amber-400 uppercase drop-shadow-md">
                                        30 SECONDS
                                    </h1>
                                    <div class="w-full h-0.5 bg-gradient-to-r from-transparent via-amber-400 to-transparent my-2"></div>
                                    <p class="text-xl font-black text-rose-500 tracking-widest uppercase">
                                        HEAO 30 JAAR
                                    </p>
                                    <p class="text-xs text-slate-400 font-semibold tracking-wider pt-2">
                                        REÜNIE EDITION '96 - '26
                                    </p>
                                </div>
                            </div>

                            {/* Tik indicator onderin */}
                            <div class="animate-bounce text-xs font-semibold text-rose-400 uppercase tracking-widest bg-rose-950/50 border border-rose-800/60 px-4 py-2 rounded-full">
                                👆 Tik om te starten
                            </div>
                        </div>
                    )}

                    {/* Header */}
                    <header class="flex justify-between items-center py-2 border-b border-slate-800 shrink-0 mb-2">
                        <div class="flex items-center space-x-2">
                            <span class="bg-rose-600 text-white font-extrabold text-xs px-2 py-1 rounded">30 SEC</span>
                            <h1 class="font-bold text-base text-slate-100 tracking-tight">HEAO '96 Edition</h1>
                        </div>
                        
                        <div>
                            {screen === 'setup' && (
                                <button onClick={() => setScreen('word_editor')} class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 py-1.5 px-3 rounded-lg border border-slate-700 font-medium">
                                    Woordenboek ({wordList.length})
                                </button>
                            )}
                            
                            {(screen === 'turn_start' || screen === 'playing' || screen === 'turn_summary') && (
                                <button onClick={handleAbortGame} class="text-xs bg-rose-950/60 hover:bg-rose-900 text-rose-300 py-1.5 px-3 rounded-lg border border-rose-800/80 font-medium transition">
                                    🛑 Stop & Menu
                                </button>
                            )}
                        </div>
                    </header>

                    {/* SCREEN: SETUP */}
                    {screen === 'setup' && (
                        <div class="flex-1 flex flex-col justify-between overflow-hidden">
                            <div class="space-y-4 overflow-y-auto pr-1 py-1">
                                <div class="bg-slate-800/60 p-3.5 rounded-xl border border-slate-700/50">
                                    <h2 class="text-xs font-semibold text-rose-400 uppercase tracking-wider mb-2">Teams Invoeren</h2>
                                    <div class="space-y-2">
                                        {teams.map((team) => (
                                            <div key={team.id} class="flex items-center space-x-2">
                                                <input
                                                    type="text"
                                                    value={team.name}
                                                    onChange={(e) => handleUpdateTeamName(team.id, e.target.value)}
                                                    class="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-sm text-slate-100 focus:outline-none focus:border-rose-500"
                                                />
                                                {teams.length > 2 && (
                                                    <button onClick={() => handleRemoveTeam(team.id)} class="text-slate-500 hover:text-rose-400 p-2">✕</button>
                                                )}
                                            </div>
                                        ))}
                                    </div>
                                    <button onClick={handleAddTeam} class="mt-2 text-xs text-rose-400 font-semibold hover:underline flex items-center">
                                        + Team Toevoegen
                                    </button>
                                </div>

                                <div class="bg-slate-800/60 p-3.5 rounded-xl border border-slate-700/50 space-y-3">
                                    <h2 class="text-xs font-semibold text-rose-400 uppercase tracking-wider">Spelinstellingen</h2>
                                    <div class="flex justify-between items-center">
                                        <span class="text-sm text-slate-300">Timer Duur (Seconden)</span>
                                        <input
                                            type="number"
                                            value={timerLength}
                                            onChange={(e) => setTimerLength(Number(e.target.value))}
                                            class="w-20 bg-slate-900 border border-slate-700 rounded-lg px-3 py-1 text-center text-sm font-semibold text-slate-100"
                                        />
                                    </div>
                                    <div class="flex justify-between items-center">
                                        <span class="text-sm text-slate-300">Streefscore (Punten)</span>
                                        <input
                                            type="number"
                                            value={targetScore}
                                            onChange={(e) => setTargetScore(Number(e.target.value))}
                                            class="w-20 bg-slate-900 border border-slate-700 rounded-lg px-3 py-1 text-center text-sm font-semibold text-slate-100"
                                        />
                                    </div>
                                </div>
                            </div>

                            <button
                                onClick={handleStartTurn}
                                class="w-full bg-rose-600 hover:bg-rose-500 text-white font-bold py-3 rounded-xl text-center shadow-lg shadow-rose-900/40 active:scale-95 transition shrink-0 mt-2"
                            >
                                Start Het Spel! 🚀
                            </button>
                        </div>
                    )}

                    {/* SCREEN: WORD EDITOR */}
                    {screen === 'word_editor' && (
                        <div class="flex-1 flex flex-col justify-between overflow-hidden">
                            <div class="flex flex-col flex-1 overflow-hidden">
                                <div class="flex justify-between items-center mb-2 shrink-0">
                                    <h2 class="font-bold text-slate-200 text-sm">Woordenboek ({wordList.length}) - A-Z</h2>
                                    <button onClick={() => setScreen('setup')} class="text-xs text-slate-400 hover:text-slate-200">← Terug</button>
                                </div>

                                <form onSubmit={handleAddWord} class="flex space-x-2 mb-3 shrink-0">
                                    <input
                                        type="text"
                                        placeholder="Nieuw HEAO / Vakantie woord..."
                                        value={newWord}
                                        onChange={(e) => setNewWord(e.target.value)}
                                        class="flex-1 bg-slate-800 border border-slate-700 rounded-lg px-3 py-1.5 text-sm text-slate-100 focus:outline-none focus:border-rose-500"
                                    />
                                    <button type="submit" class="bg-rose-600 text-white text-sm font-bold px-3 py-1.5 rounded-lg">Toevoegen</button>
                                </form>

                                <div class="flex-1 overflow-y-auto space-y-1.5 pr-1 mb-2 border border-slate-800 rounded-lg p-2 bg-slate-950/40">
                                    {wordList.map((word, idx) => (
                                        <div key={idx} class="flex justify-between items-center bg-slate-800/80 px-3 py-1.5 rounded text-sm text-slate-200">
                                            <span>{word}</span>
                                            <button onClick={() => handleRemoveWord(word)} class="text-slate-500 hover:text-rose-400 text-xs font-bold">✕</button>
                                        </div>
                                    ))}
                                </div>
                            </div>

                            <div class="space-y-2 shrink-0 pt-1">
                                <button 
                                    onClick={handleResetToDefaultWords} 
                                    class="w-full bg-rose-950/60 hover:bg-rose-900/80 text-rose-300 py-2 rounded-lg text-xs font-bold border border-rose-800/80 transition"
                                >
                                    🔄 Herstel naar Standaard Woorden
                                </button>
                                
                                <div class="flex space-x-2">
                                    <button onClick={handleExportWords} class="flex-1 bg-slate-800 text-slate-300 py-2 rounded-lg text-xs font-semibold border border-slate-700">
                                        Exporteer (.JSON)
                                    </button>
                                    <label class="flex-1 bg-slate-800 text-slate-300 py-2 rounded-lg text-xs font-semibold border border-slate-700 text-center cursor-pointer">
                                        Importeer (.JSON)
                                        <input type="file" accept=".json" onChange={handleImportWords} class="hidden" />
                                    </label>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* SCREEN: TURN START */}
                    {screen === 'turn_start' && (
                        <div class="flex-1 flex flex-col justify-between items-center text-center my-auto py-4">
                            <div class="my-auto space-y-4 w-full">
                                <div class="bg-slate-800/50 p-6 rounded-2xl border border-slate-700/50 w-full">
                                    <p class="text-xs text-rose-400 font-bold uppercase tracking-widest mb-1">Aan de beurt</p>
                                    <h2 class="text-2xl font-extrabold text-white mb-2">{teams[currentTeamIdx].name}</h2>
                                    <p class="text-sm text-slate-400">Huidige score: <span class="font-bold text-slate-200">{teams[currentTeamIdx].score}</span> / {targetScore} ptn</p>
                                </div>

                                <div class="text-slate-400 text-xs px-4">
                                    Zorg dat de omschrijver de telefoon vasthoudt. Zodra je op "START TIMER" klikt lopen de 30 seconden direct!
                                </div>
                            </div>

                            <button
                                onClick={handleBeginTimer}
                                class="w-full bg-rose-600 hover:bg-rose-500 text-white font-bold py-3.5 rounded-xl text-lg shadow-xl shadow-rose-900/50 active:scale-95 transition shrink-0"
                            >
                                START TIMER ⏱️
                            </button>
                        </div>
                    )}

                    {/* SCREEN: PLAYING */}
                    {screen === 'playing' && (
                        <div class="flex-1 flex flex-col justify-between py-1">
                            <div class="flex justify-between items-center bg-slate-800/80 p-2.5 rounded-xl border border-slate-700 shrink-0">
                                <div>
                                    <p class="text-xs text-slate-400">{teams[currentTeamIdx].name}</p>
                                    <p class="text-xs text-rose-400 font-bold">Vink aan wat geraden is!</p>
                                </div>
                                <div class={`text-2xl font-black font-mono px-3 py-1 rounded-lg ${timeLeft <= 5 ? 'bg-rose-600 text-white pulse-fast' : 'bg-slate-900 text-rose-400 border border-slate-700'}`}>
                                    {timeLeft}s
                                </div>
                            </div>

                            <div class="space-y-2 my-auto py-2">
                                {currentWords.map((word, idx) => (
                                    <button
                                        key={idx}
                                        onClick={() => toggleCheckWord(idx)}
                                        class={`w-full p-3 rounded-xl text-left font-bold text-sm transition flex justify-between items-center border ${
                                            checkedWords[idx]
                                                ? 'bg-emerald-950/80 border-emerald-500 text-emerald-200 shadow-md shadow-emerald-950'
                                                : 'bg-slate-800 border-slate-700 text-slate-100 hover:bg-slate-750'
                                        }`}
                                    >
                                        <span>{word}</span>
                                        <span class={`w-5 h-5 rounded-full flex items-center justify-center text-xs font-black ${
                                            checkedWords[idx] ? 'bg-emerald-500 text-slate-950' : 'border-2 border-slate-600'
                                        }`}>
                                            {checkedWords[idx] ? '✓' : ''}
                                        </span>
                                    </button>
                                ))}
                            </div>

                            <button
                                onClick={handleFinishTurn}
                                class="w-full bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold py-3 rounded-xl border border-slate-600 shrink-0"
                            >
                                Ronde Nu Afronden ➔
                            </button>
                        </div>
                    )}

                    {/* SCREEN: TURN SUMMARY */}
                    {screen === 'turn_summary' && (
                        <div class="flex-1 flex flex-col justify-between py-2">
                            <div class="text-center my-auto space-y-3">
                                <div class="inline-block bg-rose-950/60 border border-rose-800 p-3 rounded-full">
                                    <span class="text-3xl">🎉</span>
                                </div>
                                <h2 class="text-lg font-bold text-slate-100">Ronde Afgelopen!</h2>
                                <p class="text-slate-300 text-sm">
                                    <span class="font-bold text-rose-400">{teams[currentTeamIdx].name}</span> heeft <span class="font-extrabold text-white text-lg">{checkedWords.filter(Boolean).length}</span> punten gescoord!
                                </p>

                                <div class="bg-slate-800/60 p-3 rounded-xl border border-slate-700 text-left space-y-1.5 mt-2">
                                    <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Tussenstand</h3>
                                    {teams.map((t, idx) => (
                                        <div key={t.id} class={`flex justify-between py-1 px-2 rounded text-sm ${idx === currentTeamIdx ? 'bg-slate-700/50 font-bold text-white' : 'text-slate-300'}`}>
                                            <span>{t.name}</span>
                                            <span class="font-mono text-rose-400">{t.score} ptn</span>
                                        </div>
                                    ))}
                                </div>
                            </div>

                            <button
                                onClick={handleNextTeam}
                                class="w-full bg-rose-600 hover:bg-rose-500 text-white font-bold py-3 rounded-xl text-center shadow-lg active:scale-95 transition shrink-0"
                            >
                                Volgende Team Aan De Beurt ➔
                            </button>
                        </div>
                    )}

                    {/* SCREEN: GAME OVER */}
                    {screen === 'game_over' && (
                        <div class="flex-1 flex flex-col justify-between items-center text-center py-4">
                            <div class="my-auto space-y-4">
                                <div class="text-5xl">🏆</div>
                                <div>
                                    <h2 class="text-2xl font-black text-white">GEFELICITEERD!</h2>
                                    <p class="text-rose-400 font-bold text-lg mt-1">{teams[currentTeamIdx].name}</p>
                                    <p class="text-xs text-slate-400 mt-2">Heeft de streefscore van {targetScore} punten gehaald!</p>
                                </div>
                            </div>

                            <button
                                onClick={() => {
                                    setTeams(teams.map(t => ({ ...t, score: 0 })));
                                    setScreen('setup');
                                }}
                                class="w-full bg-rose-600 hover:bg-rose-500 text-white font-bold py-3.5 rounded-xl shrink-0"
                            >
                                Nieuw Spel Starten 🔄
                            </button>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
