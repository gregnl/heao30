<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>30 Seconds - HEAO '96 Edition</title>
    
    <!-- Favicons & App Icons -->
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="apple-touch-icon" href="logo.png">

    <!-- PWA / Standalone App meta tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="HEAO-30">
    <meta name="application-name" content="HEAO-30">

    <!-- Web App Manifest -->
    <link rel="manifest" href='data:application/manifest+json,{"name":"HEAO-30","short_name":"HEAO-30","start_url":".","display":"standalone","background_color":"#080b11","theme_color":"#080b11","icons":[{"src":"logo.png","sizes":"192x192","type":"image/png"},{"src":"logo.png","sizes":"512x512","type":"image/png"}]}'>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
      }
    </script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap');
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .pulse-fast { animation: pulse 0.5s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }
        
        .fade-out {
            animation: fadeOut 0.4s ease-in-out forwards;
        }
        @keyframes fadeOut {
            from { opacity: 1; visibility: visible; }
            to { opacity: 0; visibility: hidden; }
        }

        /* Vurige Opzwel- en Explosie-animaties */
        @keyframes swell {
            0% { transform: scale(1) rotate(0deg); filter: brightness(1); }
            50% { transform: scale(1.25) rotate(15deg); filter: brightness(1.8) drop-shadow(0 0 25px #f97316); }
            100% { transform: scale(1.4) rotate(-10deg); filter: brightness(2.5) drop-shadow(0 0 40px #ef4444); }
        }
        .animate-swell {
            animation: swell 0.6s cubic-bezier(0.36, 0, 0.66, -0.56) forwards;
        }

        @keyframes explodeParticle {
            0% { transform: translate(0, 0) scale(1); opacity: 1; }
            100% { transform: translate(var(--tw-translate-x), var(--tw-translate-y)) scale(0); opacity: 0; }
        }
        .particle-fire {
            animation: explodeParticle 0.8s ease-out forwards;
        }

        /* Screen Shake effect bij explosie */
        @keyframes screenShake {
            0% { transform: translate(0, 0) rotate(0deg); }
            20% { transform: translate(-8px, 6px) rotate(-1deg); }
            40% { transform: translate(8px, -6px) rotate(1deg); }
            60% { transform: translate(-5px, -4px) rotate(-0.5deg); }
            80% { transform: translate(5px, 4px) rotate(0.5deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }
        .animate-shake {
            animation: screenShake 0.35s ease-in-out;
        }
    </style>
</head>
<body class="bg-slate-100 dark:bg-slate-900 text-slate-800 dark:text-slate-100 h-screen h-dvh max-h-dvh overflow-hidden selection:bg-rose-500 selection:text-white transition-colors duration-200">

    <div id="root" class="h-full w-full"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const APP_VERSION = "1.0.25";

        const TEAM_COLORS = [
            '#e11d48', '#2563eb', '#059669', '#d97706', 
            '#7c3aed', '#db2777', '#0891b2', '#4338ca'
        ];

        const INITIAL_TEAMS = [
            { id: 1, name: 'Oliebollen', score: 0 },
            { id: 2, name: 'Lachebekken', score: 0 }
        ];

        const DIFFICULTY_OPTIONS = [
            { id: 'heao', label: 'HEAO \'96' },
            { id: 'makkelijk', label: 'Makkelijk' },
            { id: 'gemiddeld', label: 'Gemiddeld' },
            { id: 'moeilijk', label: 'Moeilijk' }
        ];

        // Web Audio Synthesizer voor Vurige Effecten & Timer Geluiden
        const playSynthSound = {
            chargeTone: (pitch) => {
                try {
                    const ctx = new (window.AudioContext || window.webkitAudioContext)();
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(150 + (pitch * 4), ctx.currentTime);
                    gain.gain.setValueAtTime(0.05, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.08);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.08);
                } catch(e) {}
            },
            explosionBoom: () => {
                try {
                    const ctx = new (window.AudioContext || window.webkitAudioContext)();
                    
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(180, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(20, ctx.currentTime + 0.5);
                    gain.gain.setValueAtTime(0.8, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.5);

                    const bufferSize = ctx.sampleRate * 0.4;
                    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
                    const data = buffer.getChannelData(0);
                    for (let i = 0; i < bufferSize; i++) {
                        data[i] = Math.random() * 2 - 1;
                    }
                    const noise = ctx.createBufferSource();
                    noise.buffer = buffer;
                    const noiseGain = ctx.createGain();
                    noiseGain.gain.setValueAtTime(0.4, ctx.currentTime);
                    noiseGain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
                    noise.connect(noiseGain);
                    noiseGain.connect(ctx.destination);
                    noise.start();
                } catch(e) {}
            },
            endBuzzer: () => {
                try {
                    const ctx = new (window.AudioContext || window.webkitAudioContext)();
                    const osc1 = ctx.createOscillator();
                    const osc2 = ctx.createOscillator();
                    const gain = ctx.createGain();

                    osc1.type = 'sawtooth';
                    osc2.type = 'square';
                    osc1.frequency.setValueAtTime(120, ctx.currentTime);
                    osc2.frequency.setValueAtTime(124, ctx.currentTime);

                    gain.gain.setValueAtTime(0.5, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.8);

                    osc1.connect(gain);
                    osc2.connect(gain);
                    gain.connect(ctx.destination);

                    osc1.start();
                    osc2.start();
                    osc1.stop(ctx.currentTime + 0.8);
                    osc2.stop(ctx.currentTime + 0.8);
                } catch(e) {}
            }
        };

        const sortAlphabetically = (words) => {
            return [...words].sort((a, b) => {
                const textA = typeof a === 'string' ? a : a.word;
                const textB = typeof b === 'string' ? b : b.word;
                return textA.localeCompare(textB, 'nl', { sensitivity: 'base' });
            });
        };

        function WheelRandomizer({ teams, onWinnerSelected }) {
            const [charge, setCharge] = useState(0);
            const [isCharging, setIsCharging] = useState(false);
            const [isSpinning, setIsSpinning] = useState(false);
            const [isExploded, setIsExploded] = useState(false);
            const [isSwelling, setIsSwelling] = useState(false);
            const [isShaking, setIsShaking] = useState(false);
            const [rotation, setRotation] = useState(0);
            const [winner, setWinner] = useState(null);

            const chargeInterval = useRef(null);
            const animFrame = useRef(null);
            const chargeRef = useRef(0);

            const numSegments = teams.length;
            const segmentAngle = 360 / numSegments;

            const startCharging = () => {
                if (isSpinning || winner || isExploded || isSwelling) return;
                setIsCharging(true);
                chargeRef.current = 0;
                setCharge(0);

                chargeInterval.current = setInterval(() => {
                    chargeRef.current += 2.5;
                    if (chargeRef.current >= 100) {
                        chargeRef.current = 100;
                        setCharge(100);
                        clearInterval(chargeInterval.current);
                        triggerExplosion();
                    } else {
                        setCharge(chargeRef.current);
                        playSynthSound.chargeTone(chargeRef.current);
                        if (navigator.vibrate && chargeRef.current % 10 === 0) {
                            navigator.vibrate(15);
                        }
                    }
                }, 30);
            };

            const triggerExplosion = () => {
                setIsCharging(false);
                setIsSwelling(true);

                setTimeout(() => {
                    setIsSwelling(false);
                    setIsExploded(true);
                    setIsShaking(true);
                    playSynthSound.explosionBoom();
                    if (navigator.vibrate) {
                        navigator.vibrate([200, 50, 150]);
                    }
                    setTimeout(() => setIsShaking(false), 350);
                }, 500);
            };

            const resetWheel = () => {
                setIsExploded(false);
                setIsSwelling(false);
                setCharge(0);
                chargeRef.current = 0;
            };

            const stopChargingAndSpin = () => {
                if (!isCharging || isExploded || isSwelling) return;
                clearInterval(chargeInterval.current);
                setIsCharging(false);

                if (chargeRef.current >= 100) return;

                const finalCharge = chargeRef.current;
                chargeRef.current = 0;
                setCharge(0);
                spinWheel(finalCharge);
            };

            const spinWheel = (chargePower) => {
                setIsSpinning(true);

                const minRotations = 360 * 4;
                const extraRotations = (chargePower / 100) * (360 * 7);
                const randomOffset = Math.random() * 360;
                const totalRotation = rotation + minRotations + extraRotations + randomOffset;

                const startTime = performance.now();
                const duration = 3500 + (chargePower / 100) * 1500;
                const initialRot = rotation;

                const animate = (currentTime) => {
                    const elapsed = currentTime - startTime;
                    const progress = Math.min(elapsed / duration, 1);
                    const easeOut = 1 - Math.pow(1 - progress, 3);
                    const currentRot = initialRot + (totalRotation - initialRot) * easeOut;

                    setRotation(currentRot);

                    if (progress < 1) {
                        animFrame.current = requestAnimationFrame(animate);
                    } else {
                        setIsSpinning(false);
                        const normalizedAngle = (360 - (currentRot % 360)) % 360;
                        const winningIndex = Math.floor(normalizedAngle / segmentAngle);
                        const selectedTeam = teams[winningIndex];
                        setWinner({ team: selectedTeam, index: winningIndex });
                    }
                };

                animFrame.current = requestAnimationFrame(animate);
            };

            useEffect(() => {
                return () => {
                    clearInterval(chargeInterval.current);
                    cancelAnimationFrame(animFrame.current);
                };
            }, []);

            const fireParticles = Array.from({ length: 20 }).map((_, i) => {
                const angle = (i / 20) * 360;
                const dist = 130 + Math.random() * 90;
                const tx = `${Math.cos((angle * Math.PI) / 180) * dist}px`;
                const ty = `${Math.sin((angle * Math.PI) / 180) * dist}px`;
                const colors = ['#ef4444', '#f97316', '#eab308', '#dc2626'];
                const bg = colors[i % colors.length];
                return { tx, ty, bg, id: i };
            });

            return (
                <div class={`flex-1 flex flex-col items-center justify-between py-2 my-auto select-none ${isShaking ? 'animate-shake' : ''}`}>
                    <div class="text-center space-y-1">
                        <h2 class="text-2xl font-black text-slate-800 dark:text-white uppercase tracking-wider">
                            Wie Begint Er?
                        </h2>
                        <p class="text-sm font-bold text-slate-500 dark:text-slate-400">
                            {isExploded 
                                ? "💥 JE VINGERT TE LANG! Het wiel is ontploft!" 
                                : winner 
                                ? "Startteam gekozen!" 
                                : "Houd het rad ingedrukt om op te laden!"}
                        </p>
                    </div>

                    <div class="relative w-72 h-72 my-4 flex items-center justify-center">
                        {!isExploded && (
                            <div class="absolute -top-3 z-20 w-0 h-0 border-l-[14px] border-l-transparent border-r-[14px] border-r-transparent border-t-[24px] border-t-rose-600 drop-shadow-md"></div>
                        )}

                        {isExploded && (
                            <div class="absolute inset-0 z-30 flex items-center justify-center pointer-events-none">
                                {fireParticles.map(p => (
                                    <div
                                        key={p.id}
                                        style={{
                                            '--tw-translate-x': p.tx,
                                            '--tw-translate-y': p.ty,
                                            backgroundColor: p.bg
                                        }}
                                        class="absolute w-6 h-6 rounded-full particle-fire shadow-xl"
                                    ></div>
                                ))}
                                <div class="text-7xl animate-bounce">🔥</div>
                            </div>
                        )}

                        {!isExploded && (
                            <div
                                onMouseDown={startCharging}
                                onMouseUp={stopChargingAndSpin}
                                onTouchStart={startCharging}
                                onTouchEnd={stopChargingAndSpin}
                                style={{
                                    transform: `rotate(${rotation}deg)`,
                                    transition: isSpinning ? 'none' : 'transform 0.1s ease-out'
                                }}
                                class={`w-full h-full rounded-full border-4 border-slate-800 dark:border-slate-200 shadow-2xl relative overflow-hidden cursor-pointer ${
                                    isSwelling ? 'animate-swell' : isCharging ? 'scale-105 shadow-orange-500/50' : ''
                                }`}
                            >
                                <svg viewBox="0 0 100 100" class="w-full h-full rounded-full">
                                    {teams.map((team, idx) => {
                                        const startAngle = idx * segmentAngle;
                                        const endAngle = (idx + 1) * segmentAngle;
                                        const x1 = 50 + 50 * Math.cos((Math.PI * (startAngle - 90)) / 180);
                                        const y1 = 50 + 50 * Math.sin((Math.PI * (startAngle - 90)) / 180);
                                        const x2 = 50 + 50 * Math.cos((Math.PI * (endAngle - 90)) / 180);
                                        const y2 = 50 + 50 * Math.sin((Math.PI * (endAngle - 90)) / 180);
                                        const largeArc = segmentAngle > 180 ? 1 : 0;
                                        const pathData = `M 50 50 L ${x1} ${y1} A 50 50 0 ${largeArc} 1 ${x2} ${y2} Z`;

                                        const textAngle = startAngle + segmentAngle / 2;
                                        const textRad = (Math.PI * (textAngle - 90)) / 180;
                                        const textX = 50 + 30 * Math.cos(textRad);
                                        const textY = 50 + 30 * Math.sin(textRad);

                                        return (
                                            <g key={team.id}>
                                                <path d={pathData} fill={TEAM_COLORS[idx % TEAM_COLORS.length]} />
                                                <text
                                                    x={textX}
                                                    y={textY}
                                                    fill="#ffffff"
                                                    fontSize="6"
                                                    fontWeight="900"
                                                    textAnchor="middle"
                                                    dominantBaseline="central"
                                                    transform={`rotate(${textAngle + 90}, ${textX}, ${textY})`}
                                                >
                                                    {team.name.length > 10 ? team.name.substring(0, 9) + '..' : team.name}
                                                </text>
                                            </g>
                                        );
                                    })}
                                </svg>
                            </div>
                        )}

                        {!isExploded && (
                            <div class="absolute w-12 h-12 bg-slate-900 border-4 border-white rounded-full flex items-center justify-center text-xl z-10 pointer-events-none shadow-md">
                                {isCharging ? '🔥' : '🎲'}
                            </div>
                        )}
                    </div>

                    <div class="w-full space-y-3 px-2">
                        <div class="space-y-1">
                            <div class="flex justify-between text-xs font-black text-slate-500 dark:text-slate-400 uppercase">
                                <span>KRACHT / DRUK</span>
                                <span class={charge >= 80 ? 'text-orange-500 font-extrabold' : ''}>
                                    {isExploded ? '💥 JE VINGERT TE LANG' : `${Math.round(charge)}%`}
                                </span>
                            </div>
                            <div class="w-full h-4 bg-slate-200 dark:bg-slate-800 rounded-full overflow-hidden border border-slate-300 dark:border-slate-700 p-0.5">
                                <div
                                    style={{ width: `${charge}%` }}
                                    class={`h-full rounded-full transition-all duration-75 ${
                                        charge >= 80 ? 'bg-gradient-to-r from-amber-500 via-orange-500 to-red-600 animate-pulse' : 'bg-rose-500'
                                    }`}
                                ></div>
                            </div>
                        </div>

                        {isExploded ? (
                            <button
                                onClick={resetWheel}
                                class="w-full py-4 rounded-xl text-lg font-black text-white bg-amber-600 hover:bg-amber-500 shadow-lg active:scale-95 transition"
                            >
                                Opnieuw proberen 🔄
                            </button>
                        ) : winner ? (
                            <div class="space-y-3">
                                <div class="p-3 bg-emerald-100 dark:bg-emerald-950/80 border border-emerald-400 dark:border-emerald-600 rounded-xl text-center">
                                    <p class="text-xs font-bold text-emerald-800 dark:text-emerald-300 uppercase">Mag beginnen:</p>
                                    <p class="text-2xl font-black text-emerald-900 dark:text-emerald-100">{winner.team.name} 🎉</p>
                                </div>
                                <button
                                    onClick={() => onWinnerSelected(winner.index)}
                                    class="w-full py-4 rounded-xl text-xl font-black text-white bg-rose-600 hover:bg-rose-500 shadow-xl active:scale-95 transition"
                                >
                                    Start Het Spel ➔
                                </button>
                            </div>
                        ) : (
                            <button
                                onMouseDown={startCharging}
                                onMouseUp={stopChargingAndSpin}
                                onTouchStart={startCharging}
                                onTouchEnd={stopChargingAndSpin}
                                disabled={isSpinning || isSwelling}
                                class={`w-full py-4 rounded-xl text-lg font-black text-white shadow-lg transition active:scale-95 ${
                                    isCharging ? 'bg-gradient-to-r from-amber-500 to-orange-600 scale-98' : 'bg-rose-600 hover:bg-rose-500'
                                }`}
                            >
                                {isSpinning ? 'AAN HET DRAAIEN... 🌀' : isCharging ? 'LAAT OP TIJD LOS! 💥' : 'HOUD INGEDRUKT OM TE DRAAIEN 🎯'}
                            </button>
                        )}
                    </div>
                </div>
            );
        }

        function App() {
            const [showSplash, setShowSplash] = useState(true);
            const [splashFading, setSplashFading] = useState(false);

            const [darkMode, setDarkMode] = useState(() => {
                const savedTheme = localStorage.getItem('heao30_theme');
                return savedTheme ? savedTheme === 'dark' : true;
            });

            const [screen, setScreen] = useState('setup');
            const [timerLength, setTimerLength] = useState(30);
            const [targetScore, setTargetScore] = useState(30);
            
            // Één enkele geselecteerde moeilijkheidsgraad/set
            const [selectedDifficulty, setSelectedDifficulty] = useState(() => {
                const saved = localStorage.getItem('heao96_difficulty');
                return saved || 'heao';
            });

            const [teams, setTeams] = useState(() => {
                const saved = localStorage.getItem('heao96_teams');
                if (saved) {
                    const parsed = JSON.parse(saved);
                    if (parsed[0]?.name?.includes('Greg') || parsed[1]?.name?.includes('Ronald') || parsed[1]?.name === 'Pannekoeken') {
                        return INITIAL_TEAMS;
                    }
                    return parsed;
                }
                return INITIAL_TEAMS;
            });

            const [wordList, setWordList] = useState(() => {
                const saved = localStorage.getItem('heao96_words');
                return saved ? JSON.parse(saved) : [];
            });

            const [currentTeamIdx, setCurrentTeamIdx] = useState(0);
            const [currentWords, setCurrentWords] = useState([]);
            const [checkedWords, setCheckedWords] = useState([false, false, false, false, false]);
            const [timeLeft, setTimeLeft] = useState(30);
            const [isTimerRunning, setIsTimerRunning] = useState(false);
            const [usedWords, setUsedWords] = useState([]);
            const [lastTurnScore, setLastTurnScore] = useState(0);

            useEffect(() => {
                if (darkMode) {
                    document.documentElement.classList.add('dark');
                    localStorage.setItem('heao30_theme', 'dark');
                } else {
                    document.documentElement.classList.remove('dark');
                    localStorage.setItem('heao30_theme', 'light');
                }
            }, [darkMode]);

            useEffect(() => {
                localStorage.setItem('heao96_difficulty', selectedDifficulty);
            }, [selectedDifficulty]);

            useEffect(() => {
                const checkForAppUpdate = async () => {
                    try {
                        const response = await fetch(`https://gregnl.github.io/heao30/index.html?t=${Date.now()}`);
                        if (response.ok) {
                            const htmlText = await response.text();
                            const match = htmlText.match(/const\s+APP_VERSION\s*=\s*["']([^"']+)["']/);
                            if (match && match[1]) {
                                const remoteVersion = match[1];
                                if (remoteVersion !== APP_VERSION) {
                                    console.log(`Nieuwe app-versie gevonden (${remoteVersion}). App wordt bijgewerkt...`);
                                    window.location.reload(true);
                                }
                            }
                        }
                    } catch (err) {
                        console.log("Offline: Geen app-update controle mogelijk.");
                    }
                };

                checkForAppUpdate();
            }, []);

            useEffect(() => {
                const fetchGitHubWords = async () => {
                    try {
                        const response = await fetch(`https://gregnl.github.io/heao30/heao96_30seconds_words.json?t=${Date.now()}`);
                        if (response.ok) {
                            const remoteWords = await response.json();
                            if (Array.isArray(remoteWords) && remoteWords.length > 0) {
                                const sortedRemote = sortAlphabetically(remoteWords);
                                setWordList(sortedRemote);
                                localStorage.setItem('heao96_words', JSON.stringify(sortedRemote));
                            }
                        }
                    } catch (error) {
                        console.log("Offline of GitHub onbereikbaar. Opgeslagen woordenlijst gebruikt.");
                    }
                };

                fetchGitHubWords();
            }, []);

            const handleSplashClick = () => {
                if (splashFading) return;
                setSplashFading(true);
                setTimeout(() => {
                    setShowSplash(false);
                    setSplashFading(false);
                }, 400);
            };

            const getFilteredWords = () => {
                if (wordList.length === 0) return [];

                return wordList.filter(item => {
                    if (typeof item === 'string') return true; 
                    const itemLevel = item.level ? item.level.toLowerCase() : 'gemiddeld';
                    return itemLevel === selectedDifficulty;
                }).map(item => typeof item === 'string' ? item : item.word);
            };

            const playBeep = (freq = 750, type = 'square', duration = 0.12) => {
                try {
                    const ctx = new (window.AudioContext || window.webkitAudioContext)();
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = type;
                    osc.frequency.value = freq;
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    gain.gain.exponentialRampToValueAtTime(0.00001, ctx.currentTime + duration);
                    osc.stop(ctx.currentTime + duration);
                } catch(e) {}
            };

            const playEndSound = () => {
                playSynthSound.endBuzzer();
                
                try {
                    const audio = new Audio('end.mp3');
                    audio.play().catch(err => console.log("Audio MP3 afspelen mislukt:", err));
                } catch(e) {}
            };

            useEffect(() => {
                localStorage.setItem('heao96_teams', JSON.stringify(teams));
            }, [teams]);

            useEffect(() => {
                let interval = null;
                if (isTimerRunning && timeLeft > 0) {
                    interval = setInterval(() => {
                        setTimeLeft(t => {
                            const nextTime = t - 1;
                            if (nextTime >= 1 && nextTime <= 4) {
                                playBeep(750, 'square', 0.12);
                            }
                            return nextTime;
                        });
                    }, 1000);
                } else if (timeLeft === 0 && isTimerRunning) {
                    setIsTimerRunning(false);
                    playEndSound();
                    handleFinishTurn(true);
                }
                return () => clearInterval(interval);
            }, [isTimerRunning, timeLeft]);

            const pickNextWords = () => {
                const activePool = getFilteredWords();
                if (activePool.length === 0) return;

                let available = activePool.filter(w => !usedWords.includes(w));
                if (available.length < 5) {
                    setUsedWords([]);
                    available = [...activePool];
                }
                const shuffled = [...available].sort(() => 0.5 - Math.random());
                const selected = shuffled.slice(0, 5);
                setCurrentWords(selected);
                setUsedWords(prev => [...prev, ...selected]);
                setCheckedWords([false, false, false, false, false]);
            };

            const resetGameScores = () => {
                setTeams(prevTeams => prevTeams.map(t => ({ ...t, score: 0 })));
                setCurrentTeamIdx(0);
            };

            const handleAbortGame = () => {
                if (confirm("Weet je zeker dat je het spel wilt stoppen? Alle huidige scores worden gereset naar 0.")) {
                    setIsTimerRunning(false);
                    resetGameScores();
                    setScreen('setup');
                }
            };

            const handleCloseApp = () => {
                if (confirm("Weet je zeker dat je wilt herstarten en naar het startscherm wilt gaan?")) {
                    setIsTimerRunning(false);
                    resetGameScores();
                    setScreen('setup');
                    setShowSplash(true);
                }
            };

            const handleAddTeam = () => {
                setTeams([...teams, { id: Date.now(), name: `Team ${teams.length + 1}`, score: 0 }]);
            };

            const handleRemoveTeam = (id) => {
                if (teams.length > 2) {
                    setTeams(teams.filter(t => t.id !== id));
                }
            };

            const handleUpdateTeamName = (id, newName) => {
                setTeams(teams.map(t => t.id === id ? { ...t, name: newName } : t));
            };

            const handleStartNewGame = () => {
                resetGameScores();
                setScreen('randomizer');
            };

            const handleRandomizerWinner = (winningIdx) => {
                setCurrentTeamIdx(winningIdx);
                handleStartTurn();
            };

            const handleStartTurn = () => {
                pickNextWords();
                setTimeLeft(timerLength);
                setScreen('turn_start');
            };

            const handleBeginTimer = () => {
                setScreen('playing');
                setIsTimerRunning(true);
            };

            const toggleCheckWord = (idx) => {
                const next = [...checkedWords];
                next[idx] = !next[idx];
                setCheckedWords(next);
            };

            const handleFinishTurn = (fromTimeout = false) => {
                setIsTimerRunning(false);
                
                const score = checkedWords.filter(Boolean).length;
                setLastTurnScore(score);

                let isWinner = false;
                
                setTeams(prevTeams => {
                    return prevTeams.map((team, idx) => {
                        if (idx === currentTeamIdx) {
                            const newScore = team.score + score;
                            if (newScore >= targetScore) {
                                isWinner = true;
                            }
                            return { ...team, score: newScore };
                        }
                        return team;
                    });
                });

                const currentTeamScore = teams[currentTeamIdx].score + score;

                if (currentTeamScore >= targetScore || isWinner) {
                    setScreen('game_over');
                } else {
                    setScreen('turn_summary');
                }
            };

            const handleNextTeam = () => {
                setCurrentTeamIdx((currentTeamIdx + 1) % teams.length);
                handleStartTurn();
            };

            return (
                <div class="relative max-w-md mx-auto w-full h-full flex flex-col p-4 justify-between bg-white dark:bg-slate-900 transition-colors">
                    
                    {/* SPLASH SCREEN */}
                    {showSplash && (
                        <div 
                            onClick={handleSplashClick} 
                            class={`fixed inset-0 z-50 bg-[#080b11] flex flex-col items-center justify-between p-8 text-center select-none cursor-pointer ${splashFading ? 'fade-out' : ''}`}
                        >
                            <div class="w-full"></div>

                            <div class="flex flex-col items-center justify-center">
                                <div class="relative w-64 h-64 mb-4 flex items-center justify-center">
                                    <img 
                                        src="logo.png" 
                                        alt="HEAO-30 Logo" 
                                        onError={(e) => { e.currentTarget.onerror = null; e.currentTarget.src = 'logo.svg'; }} 
                                        class="w-full h-full object-contain drop-shadow-2xl rounded-2xl"
                                    />
                                </div>

                                <div class="space-y-1">
                                    <h1 class="text-5xl font-black tracking-wider text-[#fbc02d] uppercase drop-shadow-md">
                                        30 SECONDS
                                    </h1>
                                    <div class="w-full h-1 bg-gradient-to-r from-transparent via-[#fbc02d] to-transparent my-3"></div>
                                    <p class="text-2xl font-black text-rose-500 tracking-widest uppercase">
                                        HEAO 30 JAAR
                                    </p>
                                    <p class="text-base text-slate-300 font-bold tracking-wider pt-1">
                                        REÜNIE EDITIE '96 - '26
                                    </p>
                                </div>
                            </div>

                            <div class="flex flex-col items-center space-y-2">
                                <span class="text-xs font-bold text-slate-400 tracking-widest uppercase">
                                    v{APP_VERSION}
                                </span>
                                <div class="animate-bounce text-base font-extrabold text-rose-300 uppercase tracking-widest bg-rose-950/80 border border-rose-700 px-6 py-3 rounded-full flex items-center justify-center gap-3">
                                    <span class="text-4xl leading-none">🖕🏽</span>
                                    <span>Tik om te starten</span>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Header */}
                    <header class="flex justify-between items-center py-2.5 border-b border-slate-200 dark:border-slate-800 shrink-0 mb-2">
                        <div class="flex items-center space-x-2.5">
                            <span class="bg-rose-600 text-white font-black text-base px-2.5 py-1 rounded-md">HEAO-30</span>
                            <h1 class="font-extrabold text-xl text-slate-800 dark:text-slate-100 tracking-tight">30 Seconds</h1>
                        </div>
                        
                        <div class="flex items-center space-x-2">
                            {(screen === 'turn_start' || screen === 'playing' || screen === 'turn_summary' || screen === 'randomizer') && (
                                <button onClick={handleAbortGame} class="text-sm bg-rose-100 dark:bg-rose-950/80 hover:bg-rose-200 dark:hover:bg-rose-900 text-rose-700 dark:text-rose-300 py-1.5 px-2.5 rounded-lg border border-rose-300 dark:border-rose-800 font-black transition">
                                    🛑 Stop
                                </button>
                            )}

                            <button 
                                onClick={() => setDarkMode(!darkMode)}
                                class="p-2 text-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 rounded-lg border border-slate-300 dark:border-slate-700 transition"
                                title="Schakel Thema"
                            >
                                {darkMode ? '☀️' : '🌙'}
                            </button>

                            <button 
                                onClick={handleCloseApp}
                                class="p-2 px-3 text-lg font-black bg-rose-100 dark:bg-rose-950/80 hover:bg-rose-200 dark:hover:bg-rose-900 text-rose-600 dark:text-rose-400 rounded-lg border border-rose-200 dark:border-rose-800 transition"
                                title="Naar Startscherm"
                            >
                                ✕
                            </button>
                        </div>
                    </header>

                    {/* SCREEN: SETUP */}
                    {screen === 'setup' && (
                        <div class="flex-1 flex flex-col justify-between overflow-hidden">
                            <div class="space-y-4 overflow-y-auto pr-1 py-1">
                                <div class="bg-slate-50 dark:bg-slate-800/60 p-4 rounded-xl border border-slate-200 dark:border-slate-700/50">
                                    <h2 class="text-base font-extrabold text-rose-600 dark:text-rose-400 uppercase tracking-wider mb-3">Teams Invoeren</h2>
                                    <div class="space-y-3">
                                        {teams.map((team) => (
                                            <div key={team.id} class="flex items-center space-x-2">
                                                <input
                                                    type="text"
                                                    value={team.name}
                                                    onChange={(e) => handleUpdateTeamName(team.id, e.target.value)}
                                                    class="flex-1 bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg px-4 py-2.5 text-lg font-bold text-slate-800 dark:text-slate-100 focus:outline-none focus:border-rose-500"
                                                />
                                                {teams.length > 2 && (
                                                    <button onClick={() => handleRemoveTeam(team.id)} class="text-slate-400 hover:text-rose-500 p-2 text-xl font-black">✕</button>
                                                )}
                                            </div>
                                        ))}
                                    </div>
                                    <button onClick={handleAddTeam} class="mt-3.5 text-base text-rose-600 dark:text-rose-400 font-extrabold hover:underline flex items-center">
                                        + Team Toevoegen
                                    </button>
                                </div>

                                {/* Knoppen naast elkaar: Woordenset Selectie (Radio) */}
                                <div class="bg-slate-50 dark:bg-slate-800/60 p-4 rounded-xl border border-slate-200 dark:border-slate-700/50 space-y-3">
                                    <h2 class="text-base font-extrabold text-rose-600 dark:text-rose-400 uppercase tracking-wider">Kies Woordenset</h2>
                                    <div class="grid grid-cols-2 gap-2">
                                        {DIFFICULTY_OPTIONS.map(opt => {
                                            const isSelected = selectedDifficulty === opt.id;
                                            return (
                                                <button
                                                    key={opt.id}
                                                    type="button"
                                                    onClick={() => setSelectedDifficulty(opt.id)}
                                                    class={`flex items-center justify-between p-3 rounded-lg font-bold text-sm border transition ${
                                                        isSelected 
                                                            ? 'bg-rose-600 border-rose-600 text-white shadow-md' 
                                                            : 'bg-white dark:bg-slate-900 border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-300 hover:border-slate-300'
                                                    }`}
                                                >
                                                    <span class="truncate">{opt.label}</span>
                                                    <span class={`w-4 h-4 rounded-full flex items-center justify-center border-2 shrink-0 ml-1.5 ${
                                                        isSelected ? 'border-white bg-white' : 'border-slate-400'
                                                    }`}>
                                                        {isSelected && <span class="w-2 h-2 rounded-full bg-rose-600"></span>}
                                                    </span>
                                                </button>
                                            );
                                        })}
                                    </div>
                                </div>

                                <div class="bg-slate-50 dark:bg-slate-800/60 p-4 rounded-xl border border-slate-200 dark:border-slate-700/50 space-y-4">
                                    <h2 class="text-base font-extrabold text-rose-600 dark:text-rose-400 uppercase tracking-wider">Spelinstellingen</h2>
                                    <div class="flex justify-between items-center">
                                        <span class="text-lg font-bold text-slate-700 dark:text-slate-200">Timer Duur (sec)</span>
                                        <input
                                            type="number"
                                            value={timerLength}
                                            onChange={(e) => setTimerLength(Number(e.target.value))}
                                            class="w-24 bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg px-3 py-2 text-center text-lg font-black text-slate-800 dark:text-slate-100"
                                        />
                                    </div>
                                    <div class="flex justify-between items-center">
                                        <span class="text-lg font-bold text-slate-700 dark:text-slate-200">Streefscore (ptn)</span>
                                        <input
                                            type="number"
                                            value={targetScore}
                                            onChange={(e) => setTargetScore(Number(e.target.value))}
                                            class="w-24 bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg px-3 py-2 text-center text-lg font-black text-slate-800 dark:text-slate-100"
                                        />
                                    </div>
                                </div>
                                
                                <div class="text-center text-base text-slate-500 dark:text-slate-400 font-semibold pt-1">
                                    Actieve woorden in deze set: <span class="font-extrabold text-slate-800 dark:text-slate-200">{getFilteredWords().length}</span> / {wordList.length} <span class="text-xs font-bold text-slate-400">(v{APP_VERSION})</span>
                                </div>
                            </div>

                            <button
                                onClick={handleStartNewGame}
                                class="w-full bg-rose-600 hover:bg-rose-500 text-white font-black py-4 rounded-xl text-xl text-center shadow-lg shadow-rose-900/30 active:scale-95 transition shrink-0 mt-2"
                            >
                                Start Het Spel! 🚀
                            </button>
                        </div>
                    )}

                    {/* SCREEN: RANDOMIZER */}
                    {screen === 'randomizer' && (
                        <WheelRandomizer teams={teams} onWinnerSelected={handleRandomizerWinner} />
                    )}

                    {/* SCREEN: TURN START */}
                    {screen === 'turn_start' && (
                        <div class="flex-1 flex flex-col justify-between items-center text-center my-auto py-4">
                            <div class="my-auto space-y-6 w-full">
                                <div class="bg-slate-50 dark:bg-slate-800/60 p-6 rounded-2xl border border-slate-200 dark:border-slate-700/50 w-full">
                                    <p class="text-base text-rose-600 dark:text-rose-400 font-extrabold uppercase tracking-widest mb-2">Aan de beurt</p>
                                    <h2 class="text-4xl font-black text-slate-800 dark:text-white mb-3">{teams[currentTeamIdx].name}</h2>
                                    <p class="text-lg text-slate-600 dark:text-slate-300 font-bold">Huidige score: <span class="font-black text-rose-600 dark:text-rose-400 text-2xl">{teams[currentTeamIdx].score}</span> / {targetScore} ptn</p>
                                </div>

                                <div class="text-slate-600 dark:text-slate-300 text-base font-semibold px-4 leading-relaxed">
                                    Zorg dat de omschrijver de telefoon vasthoudt. Zodra je op "START TIMER" klikt lopen de {timerLength} seconden direct!
                                </div>
                            </div>

                            <button
                                onClick={handleBeginTimer}
                                class="w-full bg-rose-600 hover:bg-rose-500 text-white font-black py-4 rounded-xl text-2xl shadow-xl shadow-rose-900/40 active:scale-95 transition shrink-0"
                            >
                                START TIMER ⏱️
                            </button>
                        </div>
                    )}

                    {/* SCREEN: PLAYING */}
                    {screen === 'playing' && (
                        <div class="flex-1 flex flex-col justify-between py-1">
                            <div class="flex justify-between items-center bg-slate-100 dark:bg-slate-800 p-3.5 rounded-xl border border-slate-200 dark:border-slate-700 shrink-0">
                                <div>
                                    <p class="text-base font-black text-slate-700 dark:text-slate-200">{teams[currentTeamIdx].name}</p>
                                    <p class="text-sm text-rose-600 dark:text-rose-400 font-extrabold">Vink aan wat geraden is!</p>
                                </div>
                                <div class={`text-4xl font-black font-mono px-4 py-1.5 rounded-xl ${timeLeft <= 5 ? 'bg-rose-600 text-white pulse-fast' : 'bg-white dark:bg-slate-900 text-rose-600 dark:text-rose-400 border border-slate-200 dark:border-slate-700'}`}>
                                    {timeLeft}s
                                </div>
                            </div>

                            <div class="space-y-3 my-auto py-2">
                                {currentWords.map((word, idx) => (
                                    <button
                                        key={idx}
                                        onClick={() => toggleCheckWord(idx)}
                                        class={`w-full p-4 rounded-xl text-left font-black text-xl transition flex justify-between items-center border ${
                                            checkedWords[idx]
                                                ? 'bg-emerald-100 dark:bg-emerald-950/80 border-emerald-400 dark:border-emerald-500 text-emerald-950 dark:text-emerald-100 shadow-sm'
                                                : 'bg-slate-50 dark:bg-slate-800 border-slate-200 dark:border-slate-700 text-slate-800 dark:text-slate-100'
                                        }`}
                                    >
                                        <span class="leading-tight">{word}</span>
                                        <span class={`w-8 h-8 rounded-full flex items-center justify-center text-base font-black shrink-0 ml-2 ${
                                            checkedWords[idx] ? 'bg-emerald-500 text-white dark:text-slate-950' : 'border-2 border-slate-300 dark:border-slate-600'
                                        }`}>
                                            {checkedWords[idx] ? '✓' : ''}
                                        </span>
                                    </button>
                                ))}
                            </div>

                            <button
                                onClick={() => handleFinishTurn(false)}
                                class="w-full bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700 text-slate-800 dark:text-slate-200 font-extrabold py-4 rounded-xl border border-slate-300 dark:border-slate-600 text-lg shrink-0"
                            >
                                Ronde Nu Afronden ➔
                            </button>
                        </div>
                    )}

                    {/* SCREEN: TURN SUMMARY */}
                    {screen === 'turn_summary' && (
                        <div class="flex-1 flex flex-col justify-between py-2">
                            <div class="text-center my-auto space-y-5">
                                <div class="inline-block bg-rose-100 dark:bg-rose-950/60 border border-rose-300 dark:border-rose-800 p-4 rounded-full">
                                    <span class="text-5xl">🎉</span>
                                </div>
                                <h2 class="text-3xl font-black text-slate-800 dark:text-slate-100">Ronde Afgelopen!</h2>
                                <p class="text-slate-700 dark:text-slate-200 text-lg font-bold">
                                    <span class="font-black text-rose-600 dark:text-rose-400">{teams[currentTeamIdx].name}</span> heeft <span class="font-black text-slate-900 dark:text-white text-3xl">{lastTurnScore}</span> punten gescoord!
                                </p>

                                <div class="bg-slate-50 dark:bg-slate-800/60 p-4 rounded-xl border border-slate-200 dark:border-slate-700 text-left space-y-2.5 mt-2">
                                    <h3 class="text-sm font-extrabold text-slate-400 uppercase tracking-wider mb-1.5">Tussenstand</h3>
                                    {teams.map((t, idx) => (
                                        <div key={t.id} class={`flex justify-between py-2 px-3.5 rounded-lg text-lg ${idx === currentTeamIdx ? 'bg-slate-200 dark:bg-slate-700/60 font-black text-slate-900 dark:text-white' : 'text-slate-700 dark:text-slate-300 font-bold'}`}>
                                            <span>{t.name}</span>
                                            <span class="font-mono font-black text-rose-600 dark:text-rose-400">{t.score} ptn</span>
                                        </div>
                                    ))}
                                </div>
                            </div>

                            <button
                                onClick={handleNextTeam}
                                class="w-full bg-rose-600 hover:bg-rose-500 text-white font-black py-4 rounded-xl text-xl text-center shadow-lg active:scale-95 transition shrink-0"
                            >
                                Volgende Team Aan De Beurt ➔
                            </button>
                        </div>
                    )}

                    {/* SCREEN: GAME OVER */}
                    {screen === 'game_over' && (
                        <div class="flex-1 flex flex-col justify-between items-center text-center py-2">
                            <div class="my-auto space-y-5 w-full flex flex-col items-center">
                                <div class="text-9xl animate-bounce leading-none drop-shadow-2xl my-2">🏆</div>
                                <div>
                                    <h2 class="text-4xl font-black text-slate-800 dark:text-white">GEFELICITEERD!</h2>
                                    <p class="text-rose-600 dark:text-rose-400 font-black text-3xl mt-1">{teams[currentTeamIdx].name}</p>
                                    <p class="text-base text-slate-600 dark:text-slate-300 font-bold mt-1">Heeft de streefscore van {targetScore} punten gehaald!</p>
                                </div>

                                <div class="bg-slate-50 dark:bg-slate-800/60 p-4 rounded-xl border border-slate-200 dark:border-slate-700 text-left space-y-2 w-full">
                                    <h3 class="text-xs font-extrabold text-slate-400 uppercase tracking-wider mb-2">Eindstand</h3>
                                    {[...teams].sort((a, b) => b.score - a.score).map((t, idx) => (
                                        <div key={t.id} class={`flex justify-between py-2 px-3.5 rounded-lg text-lg ${t.id === teams[currentTeamIdx].id ? 'bg-rose-100 dark:bg-rose-950/80 border border-rose-300 dark:border-rose-800 font-black text-rose-900 dark:text-rose-100' : 'text-slate-700 dark:text-slate-300 font-bold'}`}>
                                            <span>{idx + 1}. {t.name}</span>
                                            <span class="font-mono font-black text-rose-600 dark:text-rose-400">{t.score} ptn</span>
                                        </div>
                                    ))}
                                </div>
                            </div>

                            <button
                                onClick={() => {
                                    resetGameScores();
                                    setScreen('setup');
                                }}
                                class="w-full bg-rose-600 hover:bg-rose-500 text-white font-black py-4 rounded-xl text-xl shrink-0 shadow-lg active:scale-95 transition"
                            >
                                Nieuw Spel Starten 🔄
                            </button>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
