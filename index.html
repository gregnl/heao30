<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>30 Seconds - HEAO '96 Editie</title>
  <link rel="manifest" href="manifest.json">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { user-select: none; -webkit-user-select: none; }
    .modal-active { overflow: hidden; }
  </style>
</head>
<body class="bg-slate-900 text-white min-h-screen font-sans flex flex-col justify-between p-4">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      const [manifest, setManifest] = useState(null);
      const [wordPools, setWordPools] = useState({});
      const [selectedCategoryIds, setSelectedCategoryIds] = useState([]);
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [loading, setLoading] = useState(true);
      const [statusMessage, setStatusMessage] = useState("Laden...");

      // 1. Initialisatie & Manifest/Versie-controle
      useEffect(() => {
        async function initApp() {
          try {
            // Uncached fetch van manifest.json om versie te controleren
            const res = await fetch(`manifest.json?t=${Date.now()}`);
            const data = await res.json();
            setManifest(data);

            const cachedVersion = parseFloat(localStorage.getItem("cached_words_version") || "0");
            const storedPools = JSON.parse(localStorage.getItem("cached_word_pools") || "{}");

            // Controleer of de versie opgehoogd is of dat er nog geen lokale cache is
            if (data.wordsVersion > cachedVersion || Object.keys(storedPools).length === 0) {
              setStatusMessage("Nieuwe woordenlijsten downloaden...");
              const fetchedPools = {};

              for (const item of data.files) {
                try {
                  const wordRes = await fetch(`${item.file}?t=${Date.now()}`);
                  const words = await wordRes.json();
                  fetchedPools[item.id] = words;
                } catch (e) {
                  console.error(`Fout bij laden van ${item.file}`, e);
                }
              }

              localStorage.setItem("cached_word_pools", JSON.stringify(fetchedPools));
              localStorage.setItem("cached_words_version", data.wordsVersion.toString());
              setWordPools(fetchedPools);
            } else {
              setWordPools(storedPools);
            }

            // Laad geselecteerde categorieën uit localStorage of vink standaard alles aan
            const savedSelection = JSON.parse(localStorage.getItem("selected_categories"));
            if (savedSelection && savedSelection.length > 0) {
              setSelectedCategoryIds(savedSelection);
            } else {
              const allIds = data.files.map(f => f.id);
              setSelectedCategoryIds(allIds);
              localStorage.setItem("selected_categories", JSON.stringify(allIds));
            }

            setLoading(false);
          } catch (err) {
            console.error("Fout bij laden van manifest:", err);
            // Fallback naar reeds opgeslagen data bij offline/netwerkfout
            const storedPools = JSON.parse(localStorage.getItem("cached_word_pools") || "{}");
            const savedSelection = JSON.parse(localStorage.getItem("selected_categories") || "[]");
            setWordPools(storedPools);
            setSelectedCategoryIds(savedSelection);
            setLoading(false);
          }
        }

        initApp();
      }, []);

      // Bewaar selectie in localStorage bij wijzigingen
      const saveSelection = (newSelection) => {
        setSelectedCategoryIds(newSelection);
        localStorage.setItem("selected_categories", JSON.stringify(newSelection));
      };

      // Toggle afzonderlijke categorie
      const toggleCategory = (id) => {
        if (selectedCategoryIds.includes(id)) {
          saveSelection(selectedCategoryIds.filter(item => item !== id));
        } else {
          saveSelection([...selectedCategoryIds, id]);
        }
      };

      // Alles selecteren / wissen
      const selectAll = () => saveSelection(manifest.files.map(f => f.id));
      const selectNone = () => saveSelection([]);

      if (loading) {
        return (
          <div class="flex flex-col items-center justify-center min-h-screen text-center p-6">
            <div class="w-12 h-12 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin mb-4"></div>
            <p class="text-slate-300 font-medium text-lg">{statusMessage}</p>
          </div>
        );
      }

      // Namen ophalen van de actieve categorieën
      const activeCategoryNames = manifest.files
        .filter(f => selectedCategoryIds.includes(f.id))
        .map(f => f.name);

      return (
        <div class="max-w-md mx-auto w-full flex flex-col justify-between min-h-screen py-4">
          
          {/* Header */}
          <div class="text-center mt-2">
            <h1 class="text-3xl font-extrabold text-indigo-400 tracking-wider">30 SECONDS</h1>
            <p class="text-slate-400 text-sm font-semibold">HEAO '96 EDITIE</p>
          </div>

          {/* Centraal blok op hoofdscherm */}
          <div class="bg-slate-800 border border-slate-700 rounded-2xl p-5 my-auto shadow-xl">
            <h2 class="text-lg font-bold text-white mb-2">Instellingen Spel</h2>
            
            {/* Woordenlijsten Selectie Knop */}
            <button 
              onClick={() => setIsModalOpen(true)}
              class="w-full bg-slate-700 hover:bg-slate-600 active:bg-slate-500 text-white font-semibold py-3 px-4 rounded-xl border border-slate-600 flex items-center justify-between transition-colors mb-4"
            >
              <span class="flex items-center gap-2">
                <span class="text-xl">📚</span> Woordenlijsten
              </span>
              <span class="text-indigo-400 text-sm font-bold">
                {selectedCategoryIds.length} van {manifest.files.length} gekozen ➔
              </span>
            </button>

            {/* Live overzicht actieve lijsten */}
            <div class="bg-slate-900/60 rounded-xl p-3 border border-slate-800">
              <span class="text-xs font-bold text-slate-400 uppercase tracking-wider block mb-2">
                Actieve lijsten:
              </span>
              {activeCategoryNames.length > 0 ? (
                <div class="flex flex-wrap gap-1.5">
                  {activeCategoryNames.map((name, idx) => (
                    <span key={idx} class="bg-indigo-900/50 text-indigo-200 border border-indigo-700/50 text-xs px-2.5 py-1 rounded-md font-medium">
                      {name}
                    </span>
                  ))}
                </div>
              ) : (
                <p class="text-xs text-amber-400 font-medium flex items-center gap-1">
                  ⚠️ Selecteer minimaal 1 woordenlijst om te kunnen spelen!
                </p>
              )}
            </div>
          </div>

          {/* Startknop */}
          <div class="mb-4">
            <button 
              disabled={selectedCategoryIds.length === 0}
              class={`w-full py-4 rounded-xl font-black text-xl shadow-lg transition-all ${
                selectedCategoryIds.length > 0 
                  ? "bg-indigo-600 hover:bg-indigo-500 active:scale-95 text-white shadow-indigo-600/30" 
                  : "bg-slate-800 text-slate-500 cursor-not-allowed border border-slate-700"
              }`}
            >
              START SPEL
            </button>
          </div>

          {/* Modal / Selectiescherm */}
          {isModalOpen && (
            <div class="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div class="bg-slate-800 border border-slate-700 w-full max-w-sm rounded-2xl p-5 shadow-2xl flex flex-col max-h-[85vh]">
                
                <div class="flex justify-between items-center mb-4 pb-2 border-b border-slate-700">
                  <h3 class="text-lg font-bold text-white">Selecteer Woordenlijsten</h3>
                  <button 
                    onClick={() => setIsModalOpen(false)}
                    class="text-slate-400 hover:text-white text-xl font-bold p-1"
                  >
                    ✕
                  </button>
                </div>

                {/* Snelknoppen */}
                <div class="flex gap-2 mb-4">
                  <button 
                    onClick={selectAll} 
                    class="flex-1 bg-slate-700 hover:bg-slate-600 text-xs font-semibold py-1.5 px-2 rounded-lg text-slate-200 border border-slate-600"
                  >
                    Alles selecteren
                  </button>
                  <button 
                    onClick={selectNone} 
                    class="flex-1 bg-slate-700 hover:bg-slate-600 text-xs font-semibold py-1.5 px-2 rounded-lg text-slate-200 border border-slate-600"
                  >
                    Wissen
                  </button>
                </div>

                {/* Lijst van opties met Checkboxes */}
                <div class="overflow-y-auto space-y-2 pr-1 my-2 flex-1">
                  {manifest.files.map((item) => {
                    const isChecked = selectedCategoryIds.includes(item.id);
                    const wordCount = wordPools[item.id] ? wordPools[item.id].length : 0;

                    return (
                      <label 
                        key={item.id}
                        onClick={() => toggleCategory(item.id)}
                        class={`flex items-center justify-between p-3 rounded-xl border cursor-pointer transition-all ${
                          isChecked 
                            ? "bg-indigo-950/60 border-indigo-500 text-white" 
                            : "bg-slate-900/40 border-slate-700/60 text-slate-400 hover:border-slate-600"
                        }`}
                      >
                        <div class="flex items-center gap-3">
                          <input 
                            type="checkbox" 
                            checked={isChecked}
                            onChange={() => {}} // Verwerkt via parent label
                            class="w-5 h-5 accent-indigo-500 rounded cursor-pointer"
                          />
                          <span class="font-semibold text-sm">{item.name}</span>
                        </div>
                        <span class="text-xs bg-slate-800 text-slate-400 px-2 py-0.5 rounded-md border border-slate-700">
                          {wordCount} woorden
                        </span>
                      </label>
                    );
                  })}
                </div>

                {/* Sluiten / OK Knop */}
                <button 
                  onClick={() => setIsModalOpen(false)}
                  class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 rounded-xl mt-4 shadow-lg active:scale-95 transition-all"
                >
                  OK / OPSLAAN
                </button>

              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
