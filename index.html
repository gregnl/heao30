<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HEAO-30 - Versie 1.0.21</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
        }
        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .difficulty-btn.active {
            border-color: #818cf8;
            background-color: #3730a3;
            color: #ffffff;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4 max-w-md mx-auto">

    <!-- Header -->
    <header class="text-center my-4">
        <h1 class="text-3xl font-extrabold tracking-tight text-indigo-400">HEAO-30</h1>
        <p class="text-xs text-slate-400 mt-1">v1.0.21</p>
    </header>

    <!-- Main Content Container -->
    <main class="space-y-6">

        <!-- Setup Screen -->
        <section id="setup-screen" class="glass-panel p-5 rounded-2xl shadow-xl space-y-4">
            <h2 class="text-lg font-bold text-slate-200">Teams</h2>

            <div class="flex gap-2">
                <input 
                    type="text" 
                    id="team-input" 
                    placeholder="Naam van team..." 
                    class="flex-1 bg-slate-800/80 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition-colors"
                    maxlength="20"
                >
                <button 
                    onclick="handleAddTeam()" 
                    class="bg-indigo-600 hover:bg-indigo-500 text-white font-medium px-4 py-2.5 rounded-xl text-sm transition-all"
                >
                    + Voeg toe
                </button>
            </div>

            <ul id="team-list" class="space-y-2"></ul>

            <button 
                id="btn-start-game"
                onclick="startGame()" 
                class="w-full mt-4 bg-emerald-600 hover:bg-emerald-500 disabled:opacity-40 disabled:cursor-not-allowed text-white font-bold py-3 rounded-xl shadow-lg transition-all"
                disabled
            >
                Start Spel
            </button>
        </section>

        <!-- Game Board Screen -->
        <section id="game-screen" class="glass-panel p-5 rounded-2xl shadow-xl hidden space-y-4">
            <div class="flex justify-between items-center border-b border-slate-700/60 pb-3">
                <div>
                    <span class="text-xs text-slate-400">Aan de beurt:</span>
                    <h3 id="current-team-display" class="text-lg font-bold text-indigo-300">-</h3>
                </div>
                <div class="text-right">
                    <span class="text-xs text-slate-400">Tijd over:</span>
                    <div id="timer-display" class="text-2xl font-black text-amber-400">30s</div>
                </div>
            </div>

            <!-- Difficulty Selection Buttons -->
            <div class="space-y-1">
                <span class="text-[10px] uppercase font-semibold text-slate-400 tracking-wider">Kies Categorie:</span>
                <div class="grid grid-cols-4 gap-1.5">
                    <button onclick="setCategory('heao')" id="btn-heao" class="difficulty-btn bg-slate-800 border border-slate-700 text-slate-300 text-xs font-medium py-2 rounded-lg transition-all hover:border-indigo-500">
                        HEAO
                    </button>
                    <button onclick="setCategory('easy')" id="btn-easy" class="difficulty-btn bg-slate-800 border border-slate-700 text-slate-300 text-xs font-medium py-2 rounded-lg transition-all hover:border-indigo-500">
                        Makkelijk
                    </button>
                    <button onclick="setCategory('intermediate')" id="btn-intermediate" class="difficulty-btn bg-slate-800 border border-slate-700 text-slate-300 text-xs font-medium py-2 rounded-lg transition-all hover:border-indigo-500">
                        Gemiddeld
                    </button>
                    <button onclick="setCategory('difficult')" id="btn-difficult" class="difficulty-btn bg-slate-800 border border-slate-700 text-slate-300 text-xs font-medium py-2 rounded-lg transition-all hover:border-indigo-500">
                        Moeilijk
                    </button>
                </div>
            </div>

            <!-- Card View -->
            <div id="card-container" class="bg-slate-800/90 border border-slate-700 rounded-2xl p-6 text-center space-y-3 my-2 min-h-[160px] flex flex-col justify-center items-center">
                <span class="text-xs font-semibold text-indigo-400 uppercase tracking-wider">Omschrijf het woord:</span>
                <p id="word-display" class="text-2xl font-extrabold text-white tracking-wide">...</p>
            </div>

            <!-- Controls -->
            <div class="grid grid-cols-2 gap-3">
                <button onclick="handleScore(false)" class="bg-rose-600/80 hover:bg-rose-600 text-white font-bold py-3 rounded-xl transition-all">
                    ❌ Fout / Pas
                </button>
                <button onclick="handleScore(true)" class="bg-emerald-600/80 hover:bg-emerald-600 text-white font-bold py-3 rounded-xl transition-all">
                    ✅ Goed (+1)
                </button>
            </div>

            <button onclick="endTurn()" class="w-full text-xs text-slate-400 hover:text-white pt-2 transition-colors">
                Beurt Beëindigen
            </button>
        </section>

        <!-- Scoreboard Screen -->
        <section id="scoreboard-screen" class="glass-panel p-5 rounded-2xl shadow-xl hidden space-y-4">
            <h2 class="text-lg font-bold text-slate-200 mb-2">Tussenstand</h2>
            <ul id="scoreboard-list" class="space-y-2"></ul>
            <button onclick="nextTurn()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 rounded-xl transition-all">
                Volgende Beurt
            </button>
        </section>

    </main>

    <!-- Footer -->
    <footer class="text-center text-xs text-slate-500 py-4">
        HEAO-30 &copy; 2026 &bull; v1.0.21
    </footer>

    <!-- Application Script -->
    <script>
        const CATEGORIES = {
            heao: { file: 'words-heao.json', words: [] },
            easy: { file: 'words-easy.json', words: [] },
            intermediate: { file: 'words-intermediate.json', words: [] },
            difficult: { file: 'words-difficult.json', words: [] }
        };

        const FALLBACK_WORDS = ["Gitaar", "Koffie", "Strand", "Sleutels", "Vakantie", "Computer", "Fiets", "Zonneschijn", "Muziek", "Telefoon"];

        let currentCategory = 'heao';
        let teams = [];
        let currentTeamIndex = 0;
        let timer = null;
        let timeLeft = 30;

        document.addEventListener("DOMContentLoaded", () => {
            document.getElementById('team-input').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') handleAddTeam();
            });
            updateTeamsUI();
            preloadWordLists();
        });

        async function preloadWordLists() {
            for (const key in CATEGORIES) {
                try {
                    const response = await fetch(CATEGORIES[key].file);
                    if (response.ok) {
                        const data = await response.json();
                        CATEGORIES[key].words = Array.isArray(data) ? data : (data.words || []);
                    }
                } catch (e) {
                    console.warn(`Kon ${CATEGORIES[key].file} niet laden. Fallback wordt gebruikt.`);
                }
            }
        }

        async function setCategory(categoryKey) {
            currentCategory = categoryKey;
            
            // Highlight actieve knop
            document.querySelectorAll('.difficulty-btn').forEach(btn => btn.classList.remove('active'));
            const activeBtn = document.getElementById(`btn-${categoryKey}`);
            if (activeBtn) activeBtn.classList.add('active');

            // Laad eventueel het bestand indien nog niet geladen
            if (!CATEGORIES[categoryKey].words.length) {
                try {
                    const response = await fetch(CATEGORIES[categoryKey].file);
                    if (response.ok) {
                        const data = await response.json();
                        CATEGORIES[categoryKey].words = Array.isArray(data) ? data : (data.words || []);
                    }
                } catch (e) {
                    console.error("Fout bij laden van JSON:", e);
                }
            }

            nextWord();
        }

        function handleAddTeam() {
            const input = document.getElementById('team-input');
            const name = input.value.trim() || `Team ${teams.length + 1}`;
            teams.push({ id: Date.now(), name, score: 0 });
            input.value = '';
            input.focus();
            updateTeamsUI();
        }

        function removeTeam(id) {
            teams = teams.filter(t => t.id !== id);
            updateTeamsUI();
        }

        function updateTeamsUI() {
            const list = document.getElementById('team-list');
            const startBtn = document.getElementById('btn-start-game');
            startBtn.disabled = teams.length === 0;

            if (teams.length === 0) {
                list.innerHTML = `<li class="text-center text-slate-500 text-xs py-4 italic">Nog geen teams toegevoegd</li>`;
                return;
            }

            list.innerHTML = teams.map((t, i) => `
                <li class="flex items-center justify-between bg-slate-800/60 border border-slate-700/50 rounded-xl p-3 text-sm">
                    <span class="font-medium text-slate-200"><span class="text-indigo-400 font-bold mr-2">${i + 1}.</span>${escapeHtml(t.name)}</span>
                    <button onclick="removeTeam(${t.id})" class="text-slate-400 hover:text-rose-400 transition-colors px-2">&times;</button>
                </li>
            `).join('');
        }

        function startGame() {
            if (teams.length === 0) return;
            currentTeamIndex = 0;
            showScreen('game-screen');
            startTurn();
        }

        function startTurn() {
            document.getElementById('current-team-display').textContent = teams[currentTeamIndex].name;
            setCategory(currentCategory);
            timeLeft = 30;
            document.getElementById('timer-display').textContent = `${timeLeft}s`;
            
            clearInterval(timer);
            timer = setInterval(() => {
                timeLeft--;
                document.getElementById('timer-display').textContent = `${timeLeft}s`;
                if (timeLeft <= 0) {
                    clearInterval(timer);
                    endTurn();
                }
            }, 1000);
        }

        function nextWord() {
            const wordList = CATEGORIES[currentCategory].words.length > 0 
                ? CATEGORIES[currentCategory].words 
                : FALLBACK_WORDS;
            
            const randomWord = wordList[Math.floor(Math.random() * wordList.length)];
            document.getElementById('word-display').textContent = randomWord;
        }

        function handleScore(isCorrect) {
            if (isCorrect) teams[currentTeamIndex].score += 1;
            nextWord();
        }

        function endTurn() {
            clearInterval(timer);
            showScreen('scoreboard-screen');
            renderScoreboard();
        }

        function renderScoreboard() {
            const list = document.getElementById('scoreboard-list');
            const sorted = [...teams].sort((a,b) => b.score - a.score);
            list.innerHTML = sorted.map(t => `
                <li class="flex justify-between items-center bg-slate-800/60 border border-slate-700/50 rounded-xl p-3 text-sm">
                    <span class="font-bold text-slate-200">${escapeHtml(t.name)}</span>
                    <span class="font-extrabold text-indigo-400">${t.score} pt</span>
                </li>
            `).join('');
        }

        function nextTurn() {
            currentTeamIndex = (currentTeamIndex + 1) % teams.length;
            showScreen('game-screen');
            startTurn();
        }

        function showScreen(screenId) {
            document.getElementById('setup-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.add('hidden');
            document.getElementById('scoreboard-screen').classList.add('hidden');
            document.getElementById(screenId).classList.remove('hidden');
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
        }
    </script>
</body>
</html>
