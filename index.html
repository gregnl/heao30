<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>30 Seconds Generator</title>
</head>
<body>

  <main class="app-container">
    <h1>30 Seconds Generator</h1>

    <!-- Categorie Selector -->
    <div class="control-group">
      <label for="categorySelect">Kies een categorie / niveau:</label>
      <select id="categorySelect">
        <option value="words-heao.json">HEAO Jubileum</option>
        <option value="words-easy.json">Makkelijk</option>
        <option value="words-medium.json" selected>Medium</option>
        <option value="words-hard.json">Moeilijk</option>
      </select>
    </div>

    <!-- Actieknop -->
    <button id="generateBtn" onclick="loadWordList()">Laad Woorden</button>

    <!-- Status / Error meldingen -->
    <div id="statusMessage"></div>

    <!-- Container voor de gegenereerde woorden -->
    <div id="wordDisplay" class="word-card"></div>
  </main>

  <script>
    async function loadWordList() {
      const selectElement = document.getElementById('categorySelect');
      const selectedFile = selectElement.value;
      const statusMessage = document.getElementById('statusMessage');
      const wordDisplay = document.getElementById('wordDisplay');

      statusMessage.textContent = 'Laden...';
      wordDisplay.textContent = '';

      try {
        // Fetch het geselecteerde JSON bestand (relatief pad)
        const response = await fetch(`./${selectedFile}`);
        
        if (!response.ok) {
          throw new Error(`Bestand niet gevonden (${response.status})`);
        }

        const words = await response.json();
        
        statusMessage.textContent = `Succesvol ${words.length} woorden geladen uit ${selectedFile}`;
        
        // Voorbeeld: Kies 5 willekeurige woorden voor een kaart
        const selectedWords = [...words].sort(() => 0.5 - Math.random()).slice(0, 5);
        
        wordDisplay.innerHTML = `
          <ul>
            ${selectedWords.map(word => `<li>${word}</li>`).join('')}
          </ul>
        `;

      } catch (error) {
        console.error('Fout bij het laden van de woorden:', error);
        statusMessage.textContent = `Kan ${selectedFile} niet laden. Controleer het bestandspad.`;
      }
    }
  </script>

</body>
</html>
