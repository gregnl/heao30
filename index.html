<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0f172a">
  
  <!-- Apple / PWA Web App & Splash Screen Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="30 Seconds">
  <link rel="apple-touch-icon" href="logo.png">
  <link rel="apple-touch-startup-image" href="logo.png">

  <title>30 Seconds - HEAO '96 Editie</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <style>
    body { 
      user-select: none; 
      -webkit-user-select: none; 
      background-color: #0f172a;
    }
    .wheel-rotate { 
      transition: transform 3.5s cubic-bezier(0.15, 0.90, 0.2, 1.00); 
    }
  </style>
</head>
<body class="bg-slate-900 text-white min-h-screen font-sans flex flex-col justify-between p-4">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const APP_VERSION = "v28.4 (Standalone / Geen Manifest)";

    // ==================== WOORDENLIJSTEN / THEMA'S ====================
    // Voeg hier eenvoudig extra thema's of woorden aan toe
    const GAME_DATA = [
      {
        id: "heao96",
        name: "HEAO '96 Reünie",
        words: [
          "Biersteker", "Tentamen", "Econometrie", "Studiefinanciering", "Hogeschool",
          "Rotterdam", "Statistiek", "Jaarclub", "Kater", "Collegekaart",
          "Boekhouden", "Proefwerk", "Koffieautomaat", "Afstuderen", "Propedeuse"
        ]
      },
      {
        id: "algemeen",
        name: "Algemeen & Bekend",
        words: [
          "Eiffeltoren", "Koning Willem-Alexander", "Max Verstappen", "Bitterbal", "Stofzuiger",
          "Pannenkoek", "Zonnebloem", "Bioscoop", "Supermarkt", "Tandborstel",
          "Vliegtuig", "Smartphone", "Koffiezetapparaat", "Paraplu", "Kerstboom"
        ]
      },
      {
        id: "muziek",
        name: "Muziek & Hits",
        words: [
          "Gitaar", "Festival", "Top 40", "Platenspeler", "Microfoon",
          "Drumstel", "Bassgitaar", "Concert", "Spotify", "Koptil"
        ]
      }
    ];

    function App() {
      // Game States: 'HOME', 'WHEEL', 'CARD', 'SCORE'
      const [gameState, setGameState] = useState('HOME');

      // Categorieën selectie (Standaard alles geselecteerd)
      const [selectedCategoryIds, setSelectedCategoryIds] = useState(GAME_DATA.map(c => c.id));
      const [isModalOpen, setIsModalOpen] = useState(false);

      // Team & Score status
      const [team1Name, setTeam1Name] = useState("Team 1");
      const [team2Name, setTeam2Name] = useState("Team 2");
      const [team1Score, setTeam1Score] = useState(0);
      const [team2Score, setTeam2Score] = useState(0);
      const [activeTeam, setActiveTeam] = useState(1);

      // Rad van Fortuin status
      const [wheelHandicap, setWheelHandicap] = useState(null);
      const [isSpinning, setIsSpinning] = useState(false);
      const [wheelRotation, setWheelRotation] = useState(0);

      // Kaart & Timer status
      const [currentWords, setCurrentWords] = useState([]);
      const [checkedWords, setCheckedWords] = useState([false, false, false, false, false]);
      const [timeLeft, setTimeLeft] = useState(30);
      const [timerActive, setTimerActive] = useState(false);

      // Geluidssignaal via Web Audio API
      const playBeep = (freq = 600, duration = 0.15) => {
        try {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (!AudioContext) return;
          const ctx = new AudioContext();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, ctx.currentTime);
          gain.gain.setValueAtTime(0.1, ctx.currentTime);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + duration);
        } catch(e) {}
      };

      // Timer verloop
      useEffect(() => {
        let interval = null;
        if (timerActive && timeLeft > 0) {
          interval = setInterval(() => {
            setTimeLeft((prev) => {
              if (prev <= 5 && prev > 1) playBeep(700, 0.1);
              return prev - 1;
            });
          }, 1000);
        } else if (timeLeft === 0 && timerActive) {
          setTimerActive(false);
          playBeep(400, 0.4);
          if (navigator.vibrate) navigator.vibrate([300, 100, 300]);
        }
        return () => clearInterval(interval);
      }, [timerActive, timeLeft]);

      // Categorie beheer
      const toggleCategory = (id) => {
        if (selectedCategoryIds.includes(id)) {
          setSelectedCategoryIds(selectedCategoryIds.filter(item => item !== id));
        } else {
          setSelectedCategoryIds([...selectedCategoryIds, id]);
        }
      };

      const selectAll = () => setSelectedCategoryIds(GAME_DATA.map(f => f.id));
      const selectNone = () => setSelectedCategoryIds([]);

      // Spelacties
      const handleStartGame = () => {
        setWheelHandicap(null);
        setGameState('WHEEL');
      };

      const spinWheel = () => {
        if (isSpinning) return;
        setIsSpinning(true);

        const outcome = Math.floor(Math.random() * 3); // 0, 1 of 2
        const fullSpins = 5 * 360;
        const segmentDegrees = 120;
        const targetDeg = fullSpins + (outcome * segmentDegrees) + 60;

        setWheelRotation(prev => prev + targetDeg);

        setTimeout(() => {
          setWheelHandicap(outcome);
          setIsSpinning(false);
        }, 3500);
      };

      const startRound = () => {
        let activePool = [];
        GAME_DATA.forEach(cat => {
          if (selectedCategoryIds.includes(cat.id)) {
            activePool = activePool.concat(cat.words);
          }
        });

        if (activePool.length < 5) {
          alert("Selecteer minimaal 1 categorie met voldoende woorden.");
          return;
        }

        const shuffled = [...activePool].sort(() => 0.5 - Math.random());
        setCurrentWords(shuffled.slice(0, 5));
        setCheckedWords([false, false, false, false, false]);
        setTimeLeft(30);
        setTimerActive(true);
        setGameState('CARD');
      };

      const toggleWordCheck = (index) => {
        const updated = [...checkedWords];
        updated[index] = !updated[index];
        setCheckedWords(updated);
      };

      const finishRound = () => {
        setTimerActive(false);
        const guessedCount = checkedWords.filter(Boolean).length;
        const pointsEarned = Math.max(0, guessedCount - (wheelHandicap || 0));

        if (activeTeam === 1) {
          setTeam1Score(prev => prev + pointsEarned);
        } else {
          setTeam2Score(prev => prev + pointsEarned);
        }

        setGameState('SCORE');
      };

      const nextTurn = () => {
        setActiveTeam(activeTeam === 1 ? 2 : 1);
        setWheelHandicap(null);
        setGameState('WHEEL');
      };

      const resetAll = () => {
        if (confirm("Weet je zeker dat je het spel wilt herstarten? De scores worden gewist.")) {
          setTeam1Score(0);
          setTeam2Score(0);
          setActiveTeam(1);
          setGameState('HOME');
        }
      };

      const activeCategoryNames = GAME_DATA
        .filter(f => selectedCategoryIds.includes(f.id))
        .map(f => f.name);

      return (
        <div class="max-w-md mx-auto w-full flex flex-col justify-between min-h-screen py-2">

          {/* ==================== 1. STARTSCHERM ==================== */}
          {gameState === 'HOME' && (
            <>
              <div class="text-center mt-2 flex flex-col items-center">
                <img 
                  src="logo.png" 
                  alt="30 Seconds Logo" 
                  class="w-24 h-24 object-contain mb-2 drop-shadow-lg"
                  onError={(e) => { e.target.style.display = 'none'; }}
                />
                
                <div class="inline-block bg-indigo-950/80 border border-indigo-500/30 px-3 py-1 rounded-full text-indigo-300 text-xs font-bold tracking-widest uppercase mb-1">
                  Reünie Special
                </div>
                <h1 class="text-4xl font-black tracking-tight text-white">30 SECONDS</h1>
                <p class="text-indigo-400 font-bold text-sm tracking-widest uppercase">HEAO '96 EDITIE</p>
              </div>

              {/* Team Invoer / Stand */}
              <div class="bg-slate-800/80 border border-slate-700/80 rounded-2xl p-4 my-2 shadow-xl backdrop-blur">
                <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">Teams & Stand</h3>
                <div class="grid grid-cols-2 gap-3">
                  <div class="bg-slate-900/80 p-3 rounded-xl border border-indigo-500/30">
                    <input 
                      type="text" 
                      value={team1Name} 
                      onChange={(e) => setTeam1Name(e.target.value)}
                      class="bg-transparent font-bold text-indigo-300 text-sm w-full outline-none border-b border-indigo-500/30 pb-1 mb-1 focus:border-indigo-400"
                      placeholder="Team 1"
                    />
                    <div class="text-2xl font-black text-white">{team1Score} <span class="text-xs text-slate-500 font-normal">ptn</span></div>
                  </div>
                  <div class="bg-slate-900/80 p-3 rounded-xl border border-pink-500/30">
                    <input 
                      type="text" 
                      value={team2Name} 
                      onChange={(e) => setTeam2Name(e.target.value)}
                      class="bg-transparent font-bold text-pink-300 text-sm w-full outline-none border-b border-pink-500/30 pb-1 mb-1 focus:border-pink-400"
                      placeholder="Team 2"
                    />
                    <div class="text-2xl font-black text-white">{team2Score} <span class="text-xs text-slate-500 font-normal">ptn</span></div>
                  </div>
                </div>
              </div>

              {/* Woordenlijsten Selectieblok */}
              <div class="bg-slate-800/80 border border-slate-700/80 rounded-2xl p-4 my-2 shadow-xl backdrop-blur">
                <div class="flex justify-between items-center mb-3">
                  <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Actieve Thema's</h3>
                  <span class="text-xs text-indigo-400 font-bold bg-indigo-950 px-2 py-0.5 rounded-full border border-indigo-800">
                    {selectedCategoryIds.length} / {GAME_DATA.length}
                  </span>
                </div>

                <button 
                  onClick={() => setIsModalOpen(true)}
                  class="w-full bg-slate-700/80 hover:bg-slate-600 active:bg-slate-500 text-white font-semibold py-3 px-4 rounded-xl border border-slate-600/80 flex items-center justify-between transition-all mb-3 shadow-inner"
                >
                  <span class="flex items-center gap-2 text-sm">
                    <span>⚙️</span> Woordenlijsten instellen
                  </span>
                  <span class="text-indigo-300 text-xs font-bold">Aanpassen ➔</span>
                </button>

                <div class="bg-slate-900/90 rounded-xl p-3 border border-slate-800 max-h-28 overflow-y-auto">
                  {activeCategoryNames.length > 0 ? (
                    <div class="flex flex-wrap gap-1.5">
                      {activeCategoryNames.map((name, idx) => (
                        <span key={idx} class="bg-indigo-900/40 text-indigo-200 border border-indigo-700/50 text-xs px-2.5 py-1 rounded-md font-medium">
                          {name}
                        </span>
                      ))}
                    </div>
                  ) : (
                    <p class="text-xs text-amber-400 font-medium">
                      ⚠️ Geen categorie gekozen! Selecteer minimaal 1 lijst.
                    </p>
                  )}
                </div>
              </div>

              {/* Knoppen */}
              <div class="mt-auto mb-2 space-y-2">
                <button 
                  onClick={handleStartGame}
                  disabled={selectedCategoryIds.length === 0}
                  class={`w-full py-4 rounded-xl font-black text-xl shadow-xl transition-all ${
                    selectedCategoryIds.length > 0 
                      ? "bg-indigo-600 hover:bg-indigo-500 active:scale-95 text-white shadow-indigo-600/30" 
                      : "bg-slate-800 text-slate-500 cursor-not-allowed border border-slate-700"
                  }`}
                >
                  START NIEUWE RONDE
                </button>

                {(team1Score > 0 || team2Score > 0) && (
                  <button 
                    onClick={resetAll}
                    class="w-full py-2 bg-slate-800/60 hover:bg-rose-950/40 text-rose-400 text-xs font-bold rounded-lg border border-slate-700/50 transition-all"
                  >
                    Reset Scores & Spel
                  </button>
                )}

                <div class="text-center mt-2">
                  <p class="text-[10px] text-slate-500 font-mono">
                    {APP_VERSION}
                  </p>
                </div>
              </div>
            </>
          )}

          {/* ==================== 2. RAD VAN FORTUIN SCHERM ==================== */}
          {gameState === 'WHEEL' && (
            <div class="flex flex-col justify-between h-full py-2">
              <div class="text-center">
                <span class={`text-xs font-bold uppercase tracking-widest px-3.5 py-1 rounded-full ${
                  activeTeam === 1 ? 'bg-indigo-950 text-indigo-300 border border-indigo-700' : 'bg-pink-950 text-pink-300 border border-pink-700'
                }`}>
                  Aan de beurt: {activeTeam === 1 ? team1Name : team2Name}
                </span>
                <h2 class="text-2xl font-black mt-3">Draai voor je Handicap</h2>
              </div>

              <div class="relative w-64 h-64 mx-auto my-auto flex items-center justify-center">
                <div class="absolute -top-3 z-20 w-0 h-0 border-l-[12px] border-l-transparent border-r-[12px] border-r-transparent border-t-[20px] border-t-amber-400 drop-shadow-md"></div>
                
                <div 
                  class="w-full h-full rounded-full border-4 border-slate-700 relative overflow-hidden shadow-2xl wheel-rotate"
                  style={{ transform: `rotate(${wheelRotation}deg)` }}
                >
                  <div class="absolute inset-0 bg-indigo-600 flex items-center justify-center text-3xl font-black" style={{ clipPath: 'polygon(50% 50%, 50% 0%, 100% 0%, 100% 100%)' }}>
                    <span class="translate-x-6 -translate-y-6">0</span>
                  </div>
                  <div class="absolute inset-0 bg-amber-600 flex items-center justify-center text-3xl font-black" style={{ clipPath: 'polygon(50% 50%, 100% 100%, 0% 100%, 0% 50%)' }}>
                    <span class="-translate-x-6 translate-y-6">1</span>
                  </div>
                  <div class="absolute inset-0 bg-rose-600 flex items-center justify-center text-3xl font-black" style={{ clipPath: 'polygon(50% 50%, 0% 50%, 0% 0%, 50% 0%)' }}>
                    <span class="-translate-x-6 -translate-y-6">2</span>
                  </div>
                  <div class="absolute inset-0 rounded-full border-8 border-slate-900/40 pointer-events-none"></div>
                </div>
              </div>

              <div class="space-y-3">
                {wheelHandicap !== null && (
                  <div class="bg-slate-800 border border-indigo-500/50 p-3 rounded-xl text-center animate-bounce">
                    <p class="text-xs text-slate-400 uppercase font-bold">Handicap deze ronde:</p>
                    <p class="text-2xl font-black text-amber-400">-{wheelHandicap} {wheelHandicap === 1 ? 'punt' : 'punten'}</p>
                  </div>
                )}

                {wheelHandicap === null ? (
                  <button 
                    onClick={spinWheel} 
                    disabled={isSpinning}
                    class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-black py-4 rounded-xl text-xl shadow-lg active:scale-95 transition-all"
                  >
                    {isSpinning ? "DRAAIEN..." : "DRAAI RAD 🎡"}
                  </button>
                ) : (
                  <button 
                    onClick={startRound} 
                    class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-black py-4 rounded-xl text-xl shadow-lg active:scale-95 transition-all"
                  >
                    PAK KAART & START TIMER ⏱️
                  </button>
                )}
              </div>
            </div>
          )}

          {/* ==================== 3. KAART & TIMER SCHERM ==================== */}
          {gameState === 'CARD' && (
            <div class="flex flex-col justify-between h-full">
              <div class="flex justify-between items-center bg-slate-800 border border-slate-700 p-3 rounded-xl">
                <div>
                  <span class="text-xs text-slate-400 font-bold uppercase block">{activeTeam === 1 ? team1Name : team2Name}</span>
                  <span class="text-xs text-amber-400 font-semibold">Handicap: -{wheelHandicap}</span>
                </div>
                <div class={`text-3xl font-black font-mono px-4 py-1 rounded-lg transition-colors ${
                  timeLeft <= 5 ? 'bg-rose-600 text-white animate-pulse' : 'bg-slate-900 text-indigo-400'
                }`}>
                  {timeLeft}s
                </div>
              </div>

              <div class="bg-slate-800 border-2 border-indigo-500/40 rounded-2xl p-4 my-auto shadow-2xl space-y-2.5">
                {currentWords.map((word, idx) => (
                  <div 
                    key={idx}
                    onClick={() => toggleWordCheck(idx)}
                    class={`p-3.5 rounded-xl border flex items-center justify-between cursor-pointer transition-all active:scale-98 ${
                      checkedWords[idx] 
                        ? 'bg-emerald-950/80 border-emerald-500 text-emerald-200' 
                        : 'bg-slate-900/90 border-slate-700 text-white hover:border-slate-500'
                    }`}
                  >
                    <span class="font-bold text-lg select-none">{word}</span>
                    <span class={`w-7 h-7 rounded-lg flex items-center justify-center font-bold text-sm transition-all ${
                      checkedWords[idx] ? 'bg-emerald-500 text-slate-950' : 'bg-slate-800 text-slate-500 border border-slate-700'
                    }`}>
                      {checkedWords[idx] ? '✓' : idx + 1}
                    </span>
                  </div>
                ))}
              </div>

              <button 
                onClick={finishRound}
                class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-black py-4 rounded-xl text-xl shadow-lg active:scale-95 transition-all"
              >
                RONDE AFRONDEN ( {checkedWords.filter(Boolean).length} / 5 )
              </button>
            </div>
          )}

          {/* ==================== 4. SCORE SCHERM ==================== */}
          {gameState === 'SCORE' && (
            <div class="flex flex-col justify-between h-full py-4 text-center">
              <div>
                <h2 class="text-3xl font-black text-indigo-400">RONDE AFGELOPEN!</h2>
                <p class="text-slate-400 text-sm font-semibold mt-1">
                  Resultaat voor {activeTeam === 1 ? team1Name : team2Name}
                </p>
              </div>

              <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 my-auto space-y-5">
                <div class="grid grid-cols-3 gap-2 border-b border-slate-700 pb-4 text-center">
                  <div>
                    <span class="text-xs text-slate-400 block font-bold">Geraden</span>
                    <span class="text-2xl font-black text-emerald-400">{checkedWords.filter(Boolean).length}</span>
                  </div>
                  <div>
                    <span class="text-xs text-slate-400 block font-bold">Handicap</span>
                    <span class="text-2xl font-black text-rose-400">-{wheelHandicap}</span>
                  </div>
                  <div>
                    <span class="text-xs text-slate-400 block font-bold">Punten</span>
                    <span class="text-2xl font-black text-amber-400">
                      +{Math.max(0, checkedWords.filter(Boolean).length - wheelHandicap)}
                    </span>
                  </div>
                </div>

                <div>
                  <span class="text-xs text-slate-400 font-bold uppercase tracking-wider block mb-3">Tussenstand</span>
                  <div class="grid grid-cols-2 gap-3">
                    <div class={`p-3 rounded-xl border ${activeTeam === 1 ? 'bg-indigo-950/80 border-indigo-500' : 'bg-slate-900 border-slate-800'}`}>
                      <span class="text-xs text-slate-400 font-bold block">{team1Name}</span>
                      <span class="text-3xl font-black text-indigo-400">{team1Score}</span>
                    </div>
                    <div class={`p-3 rounded-xl border ${activeTeam === 2 ? 'bg-pink-950/80 border-pink-500' : 'bg-slate-900 border-slate-800'}`}>
                      <span class="text-xs text-slate-400 font-bold block">{team2Name}</span>
                      <span class="text-3xl font-black text-pink-400">{team2Score}</span>
                    </div>
                  </div>
                </div>
              </div>

              <button 
                onClick={nextTurn}
                class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-black py-4 rounded-xl text-xl shadow-lg active:scale-95 transition-all"
              >
                VOLGENDE BEURT ({activeTeam === 1 ? team2Name : team1Name}) ➔
              </button>
            </div>
          )}

          {/* ==================== SELECTIESCHERM MODAL ==================== */}
          {isModalOpen && (
            <div class="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div class="bg-slate-800 border border-slate-700 w-full max-w-sm rounded-2xl p-5 shadow-2xl flex flex-col max-h-[85vh]">
                
                <div class="flex justify-between items-center mb-4 pb-2 border-b border-slate-700">
                  <h3 class="text-lg font-bold text-white">Selecteer Woordenlijsten</h3>
                  <button onClick={() => setIsModalOpen(false)} class="text-slate-400 hover:text-white text-xl font-bold p-1">
                    ✕
                  </button>
                </div>

                <div class="flex gap-2 mb-4">
                  <button onClick={selectAll} class="flex-1 bg-slate-700 hover:bg-slate-600 text-xs font-semibold py-1.5 px-2 rounded-lg text-slate-200 border border-slate-600">
                    Alles selecteren
                  </button>
                  <button onClick={selectNone} class="flex-1 bg-slate-700 hover:bg-slate-600 text-xs font-semibold py-1.5 px-2 rounded-lg text-slate-200 border border-slate-600">
                    Wissen
                  </button>
                </div>

                <div class="overflow-y-auto space-y-2 pr-1 my-2 flex-1">
                  {GAME_DATA.map((item) => {
                    const isChecked = selectedCategoryIds.includes(item.id);

                    return (
                      <label 
                        key={item.id}
                        onClick={() => toggleCategory(item.id)}
                        class={`flex items-center justify-between p-3 rounded-xl border cursor-pointer transition-all ${
                          isChecked 
                            ? "bg-indigo-950/60 border-indigo-500 text-white" 
                            : "bg-slate-900/40 border-slate-700/60 text-slate-400 hover:border-slate-600"
                        }`}
                      >
                        <div class="flex items-center gap-3">
                          <input 
                            type="checkbox" 
                            checked={isChecked}
                            onChange={() => {}} 
                            class="w-5 h-5 accent-indigo-500 rounded cursor-pointer"
                          />
                          <span class="font-semibold text-sm">{item.name}</span>
                        </div>
                        <span class="text-xs bg-slate-800 text-slate-400 px-2 py-0.5 rounded-md border border-slate-700">
                          {item.words.length} woorden
                        </span>
                      </label>
                    );
                  })}
                </div>

                <button 
                  onClick={() => setIsModalOpen(false)}
                  class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 rounded-xl mt-4 shadow-lg active:scale-95 transition-all"
                >
                  OK / OPSLAAN
                </button>

              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
