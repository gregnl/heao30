<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>30 Seconds - HEAO '96 Edition</title>
    
    <!-- PWA / Standalone App meta tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="HEAO-30">
    <meta name="application-name" content="HEAO-30">

    <!-- Apple Touch Icon -->
    <link rel="apple-touch-icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 500 500'><rect width='500' height='500' fill='%23080b11'/><g transform='translate(50, 65)'><rect x='60' y='60' width='220' height='300' rx='28' fill='%2338bdf8' transform='rotate(-11 170 210)'/><rect x='125' y='30' width='225' height='305' rx='28' fill='%23facc15' transform='rotate(6 237 182)'/><path d='M 175 140 L 225 152' stroke='%23080b11' stroke-width='18' stroke-linecap='round'/><path d='M 275 162 L 325 150' stroke='%23080b11' stroke-width='18' stroke-linecap='round'/><path d='M 165 195 Q 240 300 325 205' stroke='%23080b11' stroke-width='16' stroke-linecap='round' fill='none'/></g></svg>">

    <!-- Web App Manifest -->
    <link rel="manifest" href='data:application/manifest+json,{"name":"HEAO-30","short_name":"HEAO-30","start_url":".","display":"standalone","background_color":"#080b11","theme_color":"#080b11","icons":[{"src":"data:image/svg+xml;utf8,<svg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 500 500%27><rect width=%27500%27 height=%27500%27 fill=%27%23080b11%27/><g transform=%27translate(50, 65)%27><rect x=%2760%27 y=%2760%27 width=%27220%27 height=%27300%27 rx=%2728%27 fill=%27%2338bdf8%27 transform=%27rotate(-11 170 210)%27/><rect x=%27125%27 y=%2730%27 width=%27225%27 height=%27305%27 rx=%2728%27 fill=%27%23facc15%27 transform=%27rotate(6 237 182)%27/><path d=%27M 175 140 L 225 152%27 stroke=%27%23080b11%27 stroke-width=%2718%27 stroke-linecap=%27round%27/><path d=%27M 275 162 L 325 150%27 stroke=%27%23080b11%27 stroke-width=%2718%27 stroke-linecap=%27round%27/><path d=%27M 165 195 Q 240 300 325 205%27 stroke=%27%23080b11%27 stroke-width=%2716%27 stroke-linecap=%27round%27 fill=%27none%27/></g></svg>","sizes":"512x512","type":"image/svg+xml"}]}'>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
      }
    </script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap');
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .pulse-fast { animation: pulse 0.5s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }
        
        .fade-out {
            animation: fadeOut 0.4s ease-in-out forwards;
        }
        @keyframes fadeOut {
            from { opacity: 1; visibility: visible; }
            to { opacity: 0; visibility: hidden; }
        }
    </style>
</head>
<body class="bg-slate-100 dark:bg-slate-900 text-slate-800 dark:text-slate-100 h-screen h-dvh max-h-dvh overflow-hidden selection:bg-rose-500 selection:text-white transition-colors duration-200">

    <div id="root" class="h-full w-full"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const APP_VERSION = "1.0.3";

        const INITIAL_TEAMS = [
            { id: 1, name: 'Oliebollen', score: 0 },
            { id: 2, name: 'Pannekoeken', score: 0 }
        ];

        const sortAlphabetically = (words) => {
            return [...words].sort((a, b) => a.localeCompare(b, 'nl', { sensitivity: 'base' }));
        };

        function App() {
            const [showSplash, setShowSplash] = useState(true);
            const [splashFading, setSplashFading] = useState(false);

            // Light / Dark mode state
            const [darkMode, setDarkMode] = useState(() => {
                const savedTheme = localStorage.getItem('heao30_theme');
                return savedTheme ? savedTheme === 'dark' : true;
            });

            const [screen, setScreen] = useState('setup');
            const [timerLength, setTimerLength] = useState(30);
            const [targetScore, setTargetScore] = useState(30);
            
            const [teams, setTeams] = useState(() => {
                const saved = localStorage.getItem('heao96_teams');
                if (saved) {
                    const parsed = JSON.parse(saved);
                    if (parsed[0]?.name?.includes('Greg') || parsed[1]?.name?.includes('Ronald')) {
                        return INITIAL_TEAMS;
                    }
                    return parsed;
                }
                return INITIAL_TEAMS;
            });

            const [wordList, setWordList] = useState(() => {
                const saved = localStorage.getItem('heao96_words');
                return saved ? JSON.parse(saved) : [];
            });

            const [currentTeamIdx, setCurrentTeamIdx] = useState(0);
            const [currentWords, setCurrentWords] = useState([]);
            const [checkedWords, setCheckedWords] = useState([false, false, false, false, false]);
            const [timeLeft, setTimeLeft] = useState(30);
            const [isTimerRunning, setIsTimerRunning] = useState(false);
            const [usedWords, setUsedWords] = useState([]);
            const [roundScore, setRoundScore] = useState(0);

            // Theme sync met HTML class
            useEffect(() => {
                if (darkMode) {
                    document.documentElement.classList.add('dark');
                    localStorage.setItem('heao30_theme', 'dark');
                } else {
                    document.documentElement.classList.remove('dark');
                    localStorage.setItem('heao30_theme', 'light');
                }
            }, [darkMode]);

            // Automatic App Code Update
            useEffect(() => {
                const checkForAppUpdate = async () => {
                    try {
                        const response = await fetch(`https://gregnl.github.io/heao30/index.html?t=${Date.now()}`);
                        if (response.ok) {
                            const htmlText = await response.text();
                            const match = htmlText.match(/const\s+APP_VERSION\s*=\s*["']([^"']+)["']/);
                            if (match && match[1]) {
                                const remoteVersion = match[1];
                                if (remoteVersion !== APP_VERSION) {
                                    console.log(`Nieuwe app-versie gevonden (${remoteVersion}). App wordt bijgewerkt...`);
                                    window.location.reload(true);
                                }
                            }
                        }
                    } catch (err) {
                        console.log("Offline: Geen app-update controle mogelijk.");
                    }
                };

                checkForAppUpdate();
            }, []);

            // Dynamische Woordenlijst ophalen van GitHub
            useEffect(() => {
                const fetchGitHubWords = async () => {
                    try {
                        const response = await fetch(`https://gregnl.github.io/heao30/heao96_30seconds_words.json?t=${Date.now()}`);
                        if (response.ok) {
                            const remoteWords = await response.json();
                            if (Array.isArray(remoteWords) && remoteWords.length > 0) {
                                const sortedRemote = sortAlphabetically(remoteWords);
                                setWordList(sortedRemote);
                                localStorage.setItem('heao96_words', JSON.stringify(sortedRemote));
                            }
                        }
                    } catch (error) {
                        console.log("Offline of GitHub onbereikbaar. Opgeslagen woordenlijst gebruikt.");
                    }
                };

                fetchGitHubWords();
            }, []);

            const handleSplashClick = () => {
                if (splashFading) return;
                setSplashFading(true);
                setTimeout(() => setShowSplash(false), 400);
            };

            const playBeep = (freq = 440, type = 'sine', duration = 0.1) => {
                try {
                    const ctx = new (window.AudioContext || window.webkitAudioContext)();
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = type;
                    osc.frequency.value = freq;
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    gain.gain.exponentialRampToValueAtTime(0.00001, ctx.currentTime + duration);
                    osc.stop(ctx.currentTime + duration);
                } catch(e) {}
            };

            useEffect(() => {
                localStorage.setItem('heao96_teams', JSON.stringify(teams));
            }, [teams]);

            useEffect(() => {
                let interval = null;
                if (isTimerRunning && timeLeft > 0) {
                    interval = setInterval(() => {
                        setTimeLeft(t => {
                            if (t <= 5 && t > 1) playBeep(600, 'square', 0.08);
                            if (t === 1) playBeep(880, 'square', 0.3);
                            return t - 1;
                        });
                    }, 1000);
                } else if (timeLeft === 0 && isTimerRunning) {
                    setIsTimerRunning(false);
                    setScreen('turn_summary');
                }
                return () => clearInterval(interval);
            }, [isTimerRunning, timeLeft]);

            const pickNextWords = () => {
                if (wordList.length === 0) return;
                let available = wordList.filter(w => !usedWords.includes(w));
                if (available.length < 5) {
                    setUsedWords([]);
                    available = [...wordList];
                }
                const shuffled = [...available].sort(() => 0.5 - Math.random());
                const selected = shuffled.slice(0, 5);
                setCurrentWords(selected);
                setUsedWords(prev => [...prev, ...selected]);
                setCheckedWords([false, false, false, false, false]);
            };

            const handleAbortGame = () => {
                if (confirm("Weet je zeker dat je de huidige ronde wilt afbreken en terug wilt naar het menu?")) {
                    setIsTimerRunning(false);
                    setScreen('setup');
                }
            };

            const handleAddTeam = () => {
                setTeams([...teams, { id: Date.now(), name: `Team ${teams.length + 1}`, score: 0 }]);
            };

            const handleRemoveTeam = (id) => {
                if (teams.length > 2) {
                    setTeams(teams.filter(t => t.id !== id));
                }
            };

            const handleUpdateTeamName = (id, newName) => {
                setTeams(teams.map(t => t.id === id ? { ...t, name: newName } : t));
            };

            const handleStartTurn = () => {
                pickNextWords();
                setTimeLeft(timerLength);
                setScreen('turn_start');
            };

            const handleBeginTimer = () => {
                setScreen('playing');
                setIsTimerRunning(true);
            };

            const toggleCheckWord = (idx) => {
                const next = [...checkedWords];
                next[idx] = !next[idx];
                setCheckedWords(next);
            };

            const handleFinishTurn = () => {
                const score = checkedWords.filter(Boolean).length;
                setRoundScore(score);
                
                const updatedTeams = [...teams];
                updatedTeams[currentTeamIdx].score += score;
                setTeams(updatedTeams);

                if (updatedTeams[currentTeamIdx].score >= targetScore) {
                    setScreen('game_over');
                } else {
                    setScreen('turn_summary');
                }
            };

            const handleNextTeam = () => {
                setCurrentTeamIdx((currentTeamIdx + 1) % teams.length);
                handleStartTurn();
            };

            return (
                <div class="relative max-w-md mx-auto w-full h-full flex flex-col p-4 justify-between bg-white dark:bg-slate-900 transition-colors">
                    
                    {/* SPLASH SCREEN */}
                    {showSplash && (
                        <div 
                            onClick={handleSplashClick} 
                            class={`fixed inset-0 z-50 bg-[#111622] flex flex-col items-center justify-between p-8 text-center select-none cursor-pointer ${splashFading ? 'fade-out' : ''}`}
                        >
                            <div class="w-full"></div>

                            <div class="flex flex-col items-center justify-center">
                                {/* Matchend 30 Seconds Logo Graphic */}
                                <div class="relative w-56 h-56 mb-6 flex items-center justify-center">
                                    <svg viewBox="0 0 300 300" class="w-full h-full drop-shadow-2xl">
                                        {/* Blauw kaartje */}
                                        <rect x="55" y="80" width="115" height="155" rx="12" fill="#29B6F6" transform="rotate(-18 112 157)" />
                                        {/* Geel kaartje */}
                                        <rect x="130" y="65" width="115" height="155" rx="12" fill="#FBC02D" transform="rotate(8 187 142)" />
                                        
                                        {/* Gezicht: Oogjes & Blije Mond (Loopt over beide kaartjes) */}
                                        <g fill="none" stroke="#111622" stroke-linecap="round">
                                            {/* Linkeroogjes */}
                                            <path d="M 90 115 Q 105 102 120 115" stroke-width="8" />
                                            <path d="M 88 128 Q 105 115 122 128" stroke-width="8" />
                                            
                                            {/* Rechteroogjes */}
                                            <path d="M 160 110 Q 178 97 195 110" stroke-width="8" />
                                            <path d="M 162 123 Q 178 110 196 123" stroke-width="8" />

                                            {/* Grote Lachende Mond met Vulling */}
                                            <path d="M 100 150 Q 148 215 198 145 Z" fill="#111622" stroke-width="2" />
                                        </g>
                                    </svg>
                                </div>

                                <div class="space-y-1">
                                    <h1 class="text-4xl font-black tracking-wider text-[#FBC02D] uppercase drop-shadow-md">
                                        30 SECONDS
                                    </h1>
                                    <div class="w-full h-0.5 bg-gradient-to-r from-transparent via-[#FBC02D] to-transparent my-2"></div>
                                    <p class="text-xl font-black text-rose-500 tracking-widest uppercase">
                                        HEAO 30 JAAR
                                    </p>
                                    <p class="text-xs text-slate-400 font-semibold tracking-wider pt-1">
                                        REÜNIE EDITION '96 - '26
                                    </p>
                                </div>
                            </div>

                            <div class="flex flex-col items-center space-y-1.5">
                                <span class="text-[10px] font-bold text-slate-500 tracking-widest uppercase">
                                    v{APP_VERSION}
                                </span>
                                <div class="animate-bounce text-xs font-semibold text-rose-400 uppercase tracking-widest bg-rose-950/50 border border-rose-800/60 px-4 py-2 rounded-full">
                                    🖕🏽 Tik om te starten
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Header met Light / Dark Toggle */}
                    <header class="flex justify-between items-center py-2 border-b border-slate-200 dark:border-slate-800 shrink-0 mb-2">
                        <div class="flex items-center space-x-2">
                            <span class="bg-rose-600 text-white font-extrabold text-xs px-2 py-1 rounded">HEAO-30</span>
                            <h1 class="font-bold text-base text-slate-800 dark:text-slate-100 tracking-tight">30 Seconds</h1>
                        </div>
                        
                        <div class="flex items-center space-x-2">
                            {(screen === 'turn_start' || screen === 'playing' || screen === 'turn_summary') && (
                                <button onClick={handleAbortGame} class="text-xs bg-rose-100 dark:bg-rose-950/60 hover:bg-rose-200 dark:hover:bg-rose-900 text-rose-700 dark:text-rose-300 py-1.5 px-3 rounded-lg border border-rose-300 dark:border-rose-800/80 font-medium transition">
                                    🛑 Stop
                                </button>
                            )}

                            {/* Light/Dark Mode Toggle */}
                            <button 
                                onClick={() => setDarkMode(!darkMode)}
                                class="p-1.5 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 rounded-lg border border-slate-300 dark:border-slate-700 transition"
                                title="Schakel Thema"
                            >
                                {darkMode ? '☀️' : '🌙'}
                            </button>
                        </div>
                    </header>

                    {/* SCREEN: SETUP */}
                    {screen === 'setup' && (
                        <div class="flex-1 flex flex-col justify-between overflow-hidden">
                            <div class="space-y-4 overflow-y-auto pr-1 py-1">
                                <div class="bg-slate-50 dark:bg-slate-800/60 p-3.5 rounded-xl border border-slate-200 dark:border-slate-700/50">
                                    <h2 class="text-xs font-semibold text-rose-600 dark:text-rose-400 uppercase tracking-wider mb-2">Teams Invoeren</h2>
                                    <div class="space-y-2">
                                        {teams.map((team) => (
                                            <div key={team.id} class="flex items-center space-x-2">
                                                <input
                                                    type="text"
                                                    value={team.name}
                                                    onChange={(e) => handleUpdateTeamName(team.id, e.target.value)}
                                                    class="flex-1 bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg px-3 py-1.5 text-sm text-slate-800 dark:text-slate-100 focus:outline-none focus:border-rose-500"
                                                />
                                                {teams.length > 2 && (
                                                    <button onClick={() => handleRemoveTeam(team.id)} class="text-slate-400 hover:text-rose-500 p-2">✕</button>
                                                )}
                                            </div>
                                        ))}
                                    </div>
                                    <button onClick={handleAddTeam} class="mt-2 text-xs text-rose-600 dark:text-rose-400 font-semibold hover:underline flex items-center">
                                        + Team Toevoegen
                                    </button>
                                </div>

                                <div class="bg-slate-50 dark:bg-slate-800/60 p-3.5 rounded-xl border border-slate-200 dark:border-slate-700/50 space-y-3">
                                    <h2 class="text-xs font-semibold text-rose-600 dark:text-rose-400 uppercase tracking-wider">Spelinstellingen</h2>
                                    <div class="flex justify-between items-center">
                                        <span class="text-sm text-slate-700 dark:text-slate-300">Timer Duur (Seconden)</span>
                                        <input
                                            type="number"
                                            value={timerLength}
                                            onChange={(e) => setTimerLength(Number(e.target.value))}
                                            class="w-20 bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg px-3 py-1 text-center text-sm font-semibold text-slate-800 dark:text-slate-100"
                                        />
                                    </div>
                                    <div class="flex justify-between items-center">
                                        <span class="text-sm text-slate-700 dark:text-slate-300">Streefscore (Punten)</span>
                                        <input
                                            type="number"
                                            value={targetScore}
                                            onChange={(e) => setTargetScore(Number(e.target.value))}
                                            class="w-20 bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg px-3 py-1 text-center text-sm font-semibold text-slate-800 dark:text-slate-100"
                                        />
                                    </div>
                                </div>
                                
                                <div class="text-center text-xs text-slate-400 dark:text-slate-500 pt-1">
                                    Geladen woorden: <span class="font-bold text-slate-600 dark:text-slate-300">{wordList.length}</span>
                                </div>
                            </div>

                            <button
                                onClick={handleStartTurn}
                                class="w-full bg-rose-600 hover:bg-rose-500 text-white font-bold py-3 rounded-xl text-center shadow-lg shadow-rose-900/30 active:scale-95 transition shrink-0 mt-2"
                            >
                                Start Het Spel! 🚀
                            </button>
                        </div>
                    )}

                    {/* SCREEN: TURN START */}
                    {screen === 'turn_start' && (
                        <div class="flex-1 flex flex-col justify-between items-center text-center my-auto py-4">
                            <div class="my-auto space-y-4 w-full">
                                <div class="bg-slate-50 dark:bg-slate-800/50 p-6 rounded-2xl border border-slate-200 dark:border-slate-700/50 w-full">
                                    <p class="text-xs text-rose-600 dark:text-rose-400 font-bold uppercase tracking-widest mb-1">Aan de beurt</p>
                                    <h2 class="text-2xl font-extrabold text-slate-800 dark:text-white mb-2">{teams[currentTeamIdx].name}</h2>
                                    <p class="text-sm text-slate-500 dark:text-slate-400">Huidige score: <span class="font-bold text-slate-700 dark:text-slate-200">{teams[currentTeamIdx].score}</span> / {targetScore} ptn</p>
                                </div>

                                <div class="text-slate-500 dark:text-slate-400 text-xs px-4">
                                    Zorg dat de omschrijver de telefoon vasthoudt. Zodra je op "START TIMER" klikt lopen de 30 seconden direct!
                                </div>
                            </div>

                            <button
                                onClick={handleBeginTimer}
                                class="w-full bg-rose-600 hover:bg-rose-500 text-white font-bold py-3.5 rounded-xl text-lg shadow-xl shadow-rose-900/40 active:scale-95 transition shrink-0"
                            >
                                START TIMER ⏱️
                            </button>
                        </div>
                    )}

                    {/* SCREEN: PLAYING */}
                    {screen === 'playing' && (
                        <div class="flex-1 flex flex-col justify-between py-1">
                            <div class="flex justify-between items-center bg-slate-100 dark:bg-slate-800/80 p-2.5 rounded-xl border border-slate-200 dark:border-slate-700 shrink-0">
                                <div>
                                    <p class="text-xs text-slate-500 dark:text-slate-400">{teams[currentTeamIdx].name}</p>
                                    <p class="text-xs text-rose-600 dark:text-rose-400 font-bold">Vink aan wat geraden is!</p>
                                </div>
                                <div class={`text-2xl font-black font-mono px-3 py-1 rounded-lg ${timeLeft <= 5 ? 'bg-rose-600 text-white pulse-fast' : 'bg-white dark:bg-slate-900 text-rose-600 dark:text-rose-400 border border-slate-200 dark:border-slate-700'}`}>
                                    {timeLeft}s
                                </div>
                            </div>

                            <div class="space-y-2 my-auto py-2">
                                {currentWords.map((word, idx) => (
                                    <button
                                        key={idx}
                                        onClick={() => toggleCheckWord(idx)}
                                        class={`w-full p-3 rounded-xl text-left font-bold text-sm transition flex justify-between items-center border ${
                                            checkedWords[idx]
                                                ? 'bg-emerald-100 dark:bg-emerald-950/80 border-emerald-400 dark:border-emerald-500 text-emerald-900 dark:text-emerald-200 shadow-sm'
                                                : 'bg-slate-50 dark:bg-slate-800 border-slate-200 dark:border-slate-700 text-slate-800 dark:text-slate-100'
                                        }`}
                                    >
                                        <span>{word}</span>
                                        <span class={`w-5 h-5 rounded-full flex items-center justify-center text-xs font-black ${
                                            checkedWords[idx] ? 'bg-emerald-500 text-white dark:text-slate-950' : 'border-2 border-slate-300 dark:border-slate-600'
                                        }`}>
                                            {checkedWords[idx] ? '✓' : ''}
                                        </span>
                                    </button>
                                ))}
                            </div>

                            <button
                                onClick={handleFinishTurn}
                                class="w-full bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700 text-slate-800 dark:text-slate-200 font-bold py-3 rounded-xl border border-slate-300 dark:border-slate-600 shrink-0"
                            >
                                Ronde Nu Afronden ➔
                            </button>
                        </div>
                    )}

                    {/* SCREEN: TURN SUMMARY */}
                    {screen === 'turn_summary' && (
                        <div class="flex-1 flex flex-col justify-between py-2">
                            <div class="text-center my-auto space-y-3">
                                <div class="inline-block bg-rose-100 dark:bg-rose-950/60 border border-rose-300 dark:border-rose-800 p-3 rounded-full">
                                    <span class="text-3xl">🎉</span>
                                </div>
                                <h2 class="text-lg font-bold text-slate-800 dark:text-slate-100">Ronde Afgelopen!</h2>
                                <p class="text-slate-600 dark:text-slate-300 text-sm">
                                    <span class="font-bold text-rose-600 dark:text-rose-400">{teams[currentTeamIdx].name}</span> heeft <span class="font-extrabold text-slate-900 dark:text-white text-lg">{checkedWords.filter(Boolean).length}</span> punten gescoord!
                                </p>

                                <div class="bg-slate-50 dark:bg-slate-800/60 p-3 rounded-xl border border-slate-200 dark:border-slate-700 text-left space-y-1.5 mt-2">
                                    <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Tussenstand</h3>
                                    {teams.map((t, idx) => (
                                        <div key={t.id} class={`flex justify-between py-1 px-2 rounded text-sm ${idx === currentTeamIdx ? 'bg-slate-200 dark:bg-slate-700/50 font-bold text-slate-900 dark:text-white' : 'text-slate-600 dark:text-slate-300'}`}>
                                            <span>{t.name}</span>
                                            <span class="font-mono text-rose-600 dark:text-rose-400">{t.score} ptn</span>
                                        </div>
                                    ))}
                                </div>
                            </div>

                            <button
                                onClick={handleNextTeam}
                                class="w-full bg-rose-600 hover:bg-rose-500 text-white font-bold py-3 rounded-xl text-center shadow-lg active:scale-95 transition shrink-0"
                            >
                                Volgende Team Aan De Beurt ➔
                            </button>
                        </div>
                    )}

                    {/* SCREEN: GAME OVER */}
                    {screen === 'game_over' && (
                        <div class="flex-1 flex flex-col justify-between items-center text-center py-4">
                            <div class="my-auto space-y-4">
                                <div class="text-5xl">🏆</div>
                                <div>
                                    <h2 class="text-2xl font-black text-slate-800 dark:text-white">GEFELICITEERD!</h2>
                                    <p class="text-rose-600 dark:text-rose-400 font-bold text-lg mt-1">{teams[currentTeamIdx].name}</p>
                                    <p class="text-xs text-slate-500 dark:text-slate-400 mt-2">Heeft de streefscore van {targetScore} punten gehaald!</p>
                                </div>
                            </div>

                            <button
                                onClick={() => {
                                    setTeams(teams.map(t => ({ ...t, score: 0 })));
                                    setScreen('setup');
                                }}
                                class="w-full bg-rose-600 hover:bg-rose-500 text-white font-bold py-3.5 rounded-xl shrink-0"
                            >
                                Nieuw Spel Starten 🔄
                            </button>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
