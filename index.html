<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>30 Seconds - HEAO '96 Editie v2.0.0</title>
  <link rel="manifest" href="manifest.json">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { user-select: none; -webkit-user-select: none; }
    .wheel-rotate { transition: transform 3s cubic-bezier(0.15, 0.90, 0.2, 1.00); }
  </style>
</head>
<body class="bg-slate-900 text-white min-h-screen font-sans flex flex-col justify-between p-4">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const APP_VERSION = "v2.0.0";

    function App() {
      // Game States: 'HOME', 'WHEEL', 'CARD', 'SCORE'
      const [gameState, setGameState] = useState('HOME');

      // Data & Sync states
      const [manifest, setManifest] = useState(null);
      const [wordPools, setWordPools] = useState({});
      const [selectedCategoryIds, setSelectedCategoryIds] = useState([]);
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [loading, setLoading] = useState(true);
      const [statusMessage, setStatusMessage] = useState("Laden...");

      // Gameplay states
      const [wheelHandicap, setWheelHandicap] = useState(null); // 0, 1, or 2
      const [isSpinning, setIsSpinning] = useState(false);
      const [wheelRotation, setWheelRotation] = useState(0);

      const [currentWords, setCurrentWords] = useState([]);
      const [checkedWords, setCheckedWords] = useState([false, false, false, false, false]);
      const [timeLeft, setTimeLeft] = useState(30);
      const [timerActive, setTimerActive] = useState(false);

      const [team1Score, setTeam1Score] = useState(0);
      const [team2Score, setTeam2Score] = useState(0);
      const [activeTeam, setActiveTeam] = useState(1);

      // Audio & Vibration helpers
      const playBeep = () => {
        try {
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          const osc = ctx.createOscillator();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(600, ctx.currentTime);
          osc.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.15);
        } catch(e) {}
      };

      // 1. Initialisatie & Manifest/Versie-controle
      useEffect(() => {
        async function initApp() {
          try {
            const res = await fetch(`manifest.json?t=${Date.now()}`);
            const data = await res.json();
            setManifest(data);

            const cachedVersion = parseFloat(localStorage.getItem("cached_words_version") || "0");
            const storedPools = JSON.parse(localStorage.getItem("cached_word_pools") || "{}");

            if (data.wordsVersion > cachedVersion || Object.keys(storedPools).length === 0) {
              setStatusMessage("Nieuwe woordenlijsten downloaden...");
              const fetchedPools = {};

              for (const item of data.files) {
                try {
                  const wordRes = await fetch(`${item.file}?t=${Date.now()}`);
                  const words = await wordRes.json();
                  fetchedPools[item.id] = words;
                } catch (e) {
                  console.error(`Fout bij laden van ${item.file}`, e);
                }
              }

              localStorage.setItem("cached_word_pools", JSON.stringify(fetchedPools));
              localStorage.setItem("cached_words_version", data.wordsVersion.toString());
              setWordPools(fetchedPools);
            } else {
              setWordPools(storedPools);
            }

            const savedSelection = JSON.parse(localStorage.getItem("selected_categories"));
            if (savedSelection && savedSelection.length > 0) {
              setSelectedCategoryIds(savedSelection);
            } else {
              const allIds = data.files.map(f => f.id);
              setSelectedCategoryIds(allIds);
              localStorage.setItem("selected_categories", JSON.stringify(allIds));
            }

            setLoading(false);
          } catch (err) {
            console.error("Fout bij laden van manifest:", err);
            const storedPools = JSON.parse(localStorage.getItem("cached_word_pools") || "{}");
            const savedSelection = JSON.parse(localStorage.getItem("selected_categories") || "[]");
            setWordPools(storedPools);
            setSelectedCategoryIds(savedSelection);
            setLoading(false);
          }
        }

        initApp();
      }, []);

      // 2. Timer Logica
      useEffect(() => {
        let interval = null;
        if (timerActive && timeLeft > 0) {
          interval = setInterval(() => {
            setTimeLeft((prev) => {
              if (prev <= 4 && prev > 1) playBeep();
              return prev - 1;
            });
          }, 1000);
        } else if (timeLeft === 0 && timerActive) {
          setTimerActive(false);
          if (navigator.vibrate) navigator.vibrate([300, 100, 300]);
        }
        return () => clearInterval(interval);
      }, [timerActive, timeLeft]);

      // Category Selection helpers
      const saveSelection = (newSelection) => {
        setSelectedCategoryIds(newSelection);
        localStorage.setItem("selected_categories", JSON.stringify(newSelection));
      };

      const toggleCategory = (id) => {
        if (selectedCategoryIds.includes(id)) {
          saveSelection(selectedCategoryIds.filter(item => item !== id));
        } else {
          saveSelection([...selectedCategoryIds, id]);
        }
      };

      const selectAll = () => saveSelection(manifest.files.map(f => f.id));
      const selectNone = () => saveSelection([]);

      // Start Spel -> Rad Scherm
      const handleStartGame = () => {
        setWheelHandicap(null);
        setGameState('WHEEL');
      };

      // Draai aan het Rad
      const spinWheel = () => {
        if (isSpinning) return;
        setIsSpinning(true);

        const outcome = Math.floor(Math.random() * 3); // 0, 1, or 2
        const extraTurns = 4 * 360;
        const segmentDegrees = 120;
        const targetDeg = extraTurns + (outcome * segmentDegrees) + 60;

        setWheelRotation(prev => prev + targetDeg);

        setTimeout(() => {
          setWheelHandicap(outcome);
          setIsSpinning(false);
        }, 3000);
      };

      // Trek 5 willekeurige woorden uit gekozen lijsten
      const startRound = () => {
        let activePool = [];
        selectedCategoryIds.forEach(id => {
          if (wordPools[id]) {
            activePool = activePool.concat(wordPools[id]);
          }
        });

        if (activePool.length < 5) {
          alert("Niet genoeg woorden beschikbaar in de geselecteerde lijsten!");
          return;
        }

        // Shuffle & pick 5
        const shuffled = [...activePool].sort(() => 0.5 - Math.random());
        setCurrentWords(shuffled.slice(0, 5));
        setCheckedWords([false, false, false, false, false]);
        setTimeLeft(30);
        setTimerActive(true);
        setGameState('CARD');
      };

      // Vink woord af
      const toggleWordCheck = (index) => {
        const next = [...checkedWords];
        next[index] = !next[index];
        setCheckedWords(next);
      };

      // Ronde afronden & Score berekenen
      const finishRound = () => {
        setTimerActive(false);
        const guessedCount = checkedWords.filter(Boolean).length;
        const pointsEarned = Math.max(0, guessedCount - (wheelHandicap || 0));

        if (activeTeam === 1) {
          setTeam1Score(prev => prev + pointsEarned);
        } else {
          setTeam2Score(prev => prev + pointsEarned);
        }

        setGameState('SCORE');
      };

      // Volgende Beurt
      const nextTurn = () => {
        setActiveTeam(activeTeam === 1 ? 2 : 1);
        setWheelHandicap(null);
        setGameState('WHEEL');
      };

      if (loading) {
        return (
          <div class="flex flex-col items-center justify-center min-h-screen text-center p-6">
            <div class="w-12 h-12 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin mb-4"></div>
            <p class="text-slate-300 font-medium text-lg">{statusMessage}</p>
          </div>
        );
      }

      const activeCategoryNames = manifest ? manifest.files
        .filter(f => selectedCategoryIds.includes(f.id))
        .map(f => f.name) : [];

      return (
        <div class="max-w-md mx-auto w-full flex flex-col justify-between min-h-screen py-4">

          {/* ==================== 1. HOOFDSCHERM ==================== */}
          {gameState === 'HOME' && (
            <>
              <div class="text-center mt-2">
                <h1 class="text-4xl font-black text-indigo-400 tracking-wider">30 SECONDS</h1>
                <p class="text-slate-400 text-sm font-semibold mt-1">HEAO '96 EDITIE</p>
              </div>

              {/* Tussenstand op Hoofdscherm */}
              <div class="grid grid-cols-2 gap-3 my-4">
                <div class="bg-slate-800 border border-slate-700 rounded-xl p-3 text-center">
                  <span class="text-xs text-slate-400 font-bold block">TEAM 1</span>
                  <span class="text-3xl font-black text-indigo-400">{team1Score}</span>
                </div>
                <div class="bg-slate-800 border border-slate-700 rounded-xl p-3 text-center">
                  <span class="text-xs text-slate-400 font-bold block">TEAM 2</span>
                  <span class="text-3xl font-black text-pink-400">{team2Score}</span>
                </div>
              </div>

              {/* Instellingen blok */}
              <div class="bg-slate-800 border border-slate-700 rounded-2xl p-5 my-auto shadow-xl">
                <h2 class="text-lg font-bold text-white mb-3">Instellingen Spel</h2>

                <button 
                  onClick={() => setIsModalOpen(true)}
                  class="w-full bg-slate-700 hover:bg-slate-600 active:bg-slate-500 text-white font-semibold py-3.5 px-4 rounded-xl border border-slate-600 flex items-center justify-between transition-colors mb-4"
                >
                  <span class="flex items-center gap-2">
                    <span class="text-xl">📚</span> Woordenlijsten
                  </span>
                  <span class="text-indigo-400 text-sm font-bold">
                    {selectedCategoryIds.length} van {manifest.files.length} gekozen ➔
                  </span>
                </button>

                <div class="bg-slate-900/60 rounded-xl p-3 border border-slate-800">
                  <span class="text-xs font-bold text-slate-400 uppercase tracking-wider block mb-2">
                    Actieve lijsten:
                  </span>
                  {activeCategoryNames.length > 0 ? (
                    <div class="flex flex-wrap gap-1.5">
                      {activeCategoryNames.map((name, idx) => (
                        <span key={idx} class="bg-indigo-900/50 text-indigo-200 border border-indigo-700/50 text-xs px-2.5 py-1 rounded-md font-medium">
                          {name}
                        </span>
                      ))}
                    </div>
                  ) : (
                    <p class="text-xs text-amber-400 font-medium flex items-center gap-1">
                      ⚠️ Selecteer minimaal 1 woordenlijst om te spelen!
                    </p>
                  )}
                </div>
              </div>

              <div class="mb-2">
                <button 
                  onClick={handleStartGame}
                  disabled={selectedCategoryIds.length === 0}
                  class={`w-full py-4 rounded-xl font-black text-xl shadow-lg transition-all ${
                    selectedCategoryIds.length > 0 
                      ? "bg-indigo-600 hover:bg-indigo-500 active:scale-95 text-white shadow-indigo-600/30" 
                      : "bg-slate-800 text-slate-500 cursor-not-allowed border border-slate-700"
                  }`}
                >
                  START SPEL
                </button>

                <div class="text-center mt-4">
                  <p class="text-[11px] text-slate-500 font-mono">
                    App {APP_VERSION} • Woordenlijsten v{manifest ? manifest.wordsVersion : '1.1'}
                  </p>
                </div>
              </div>
            </>
          )}

          {/* ==================== 2. RAD VAN FORTUIN SCHERM ==================== */}
          {gameState === 'WHEEL' && (
            <div class="flex flex-col justify-between h-full py-2">
              <div class="text-center">
                <span class={`text-xs font-bold uppercase tracking-widest px-3 py-1 rounded-full ${
                  activeTeam === 1 ? 'bg-indigo-900/80 text-indigo-300 border border-indigo-700' : 'bg-pink-900/80 text-pink-300 border border-pink-700'
                }`}>
                  Aan de beurt: Team {activeTeam}
                </span>
                <h2 class="text-2xl font-black mt-3">Draai voor je Handicap</h2>
              </div>

              {/* Visueel Rad */}
              <div class="relative w-64 h-64 mx-auto my-auto flex items-center justify-center">
                {/* Pointer */}
                <div class="absolute -top-3 z-20 w-0 h-0 border-l-[12px] border-l-transparent border-r-[12px] border-r-transparent border-t-[20px] border-t-amber-400 drop-shadow-md"></div>
                
                {/* Draaiende Cirkel */}
                <div 
                  class="w-full h-full rounded-full border-4 border-slate-700 relative overflow-hidden shadow-2xl wheel-rotate"
                  style={{ transform: `rotate(${wheelRotation}deg)` }}
                >
                  <div class="absolute inset-0 bg-indigo-600 flex items-center justify-center text-2xl font-black" style={{ clipPath: 'polygon(50% 50%, 50% 0%, 100% 0%, 100% 100%)' }}>0</div>
                  <div class="absolute inset-0 bg-amber-600 flex items-center justify-center text-2xl font-black" style={{ clipPath: 'polygon(50% 50%, 100% 100%, 0% 100%, 0% 50%)' }}>1</div>
                  <div class="absolute inset-0 bg-rose-600 flex items-center justify-center text-2xl font-black" style={{ clipPath: 'polygon(50% 50%, 0% 50%, 0% 0%, 50% 0%)' }}>2</div>
                  <div class="absolute inset-0 rounded-full border-8 border-slate-900/40 pointer-events-none"></div>
                </div>
              </div>

              {/* Resultaat & Volgende Knop */}
              <div class="space-y-3">
                {wheelHandicap !== null && (
                  <div class="bg-slate-800 border border-indigo-500/50 p-3 rounded-xl text-center animate-bounce">
                    <p class="text-xs text-slate-400 uppercase font-bold">Handicap deze ronde:</p>
                    <p class="text-2xl font-black text-amber-400">-{wheelHandicap} punten</p>
                  </div>
                )}

                {wheelHandicap === null ? (
                  <button 
                    onClick={spinWheel} 
                    disabled={isSpinning}
                    class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-black py-4 rounded-xl text-xl shadow-lg active:scale-95 transition-all"
                  >
                    {isSpinning ? "DRAAIEN..." : "DRAAI RAD 🎡"}
                  </button>
                ) : (
                  <button 
                    onClick={startRound} 
                    class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-black py-4 rounded-xl text-xl shadow-lg active:scale-95 transition-all"
                  >
                    PAK KAART & START TIMER ⏱️
                  </button>
                )}
              </div>
            </div>
          )}

          {/* ==================== 3. KAART & TIMER SCHERM ==================== */}
          {gameState === 'CARD' && (
            <div class="flex flex-col justify-between h-full">
              {/* Top Bar: Timer */}
              <div class="flex justify-between items-center bg-slate-800 border border-slate-700 p-3 rounded-xl">
                <div>
                  <span class="text-xs text-slate-400 font-bold uppercase block">Team {activeTeam}</span>
                  <span class="text-xs text-amber-400 font-semibold">Handicap: -{wheelHandicap}</span>
                </div>
                <div class={`text-3xl font-black font-mono px-4 py-1 rounded-lg ${
                  timeLeft <= 5 ? 'bg-rose-600 text-white animate-pulse' : 'bg-slate-900 text-indigo-400'
                }`}>
                  {timeLeft}s
                </div>
              </div>

              {/* Het Woordenkaartje */}
              <div class="bg-slate-800 border-2 border-indigo-500/40 rounded-2xl p-4 my-auto shadow-2xl space-y-2.5">
                {currentWords.map((word, idx) => (
                  <div 
                    key={idx}
                    onClick={() => toggleWordCheck(idx)}
                    class={`p-3.5 rounded-xl border flex items-center justify-between cursor-pointer transition-all active:scale-98 ${
                      checkedWords[idx] 
                        ? 'bg-emerald-950/80 border-emerald-500 text-emerald-200' 
                        : 'bg-slate-900/90 border-slate-700 text-white hover:border-slate-500'
                    }`}
                  >
                    <span class="font-bold text-lg">{word}</span>
                    <span class={`w-7 h-7 rounded-lg flex items-center justify-center font-bold text-sm ${
                      checkedWords[idx] ? 'bg-emerald-500 text-slate-950' : 'bg-slate-800 text-slate-500 border border-slate-700'
                    }`}>
                      {checkedWords[idx] ? '✓' : idx + 1}
                    </span>
                  </div>
                ))}
              </div>

              {/* Afronden Knop */}
              <button 
                onClick={finishRound}
                class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-black py-4 rounded-xl text-xl shadow-lg active:scale-95 transition-all"
              >
                RONDE AFRONDEN ( {checkedWords.filter(Boolean).length} / 5 )
              </button>
            </div>
          )}

          {/* ==================== 4. SCORE & OVERZICHT SCHERM ==================== */}
          {gameState === 'SCORE' && (
            <div class="flex flex-col justify-between h-full py-4 text-center">
              <div>
                <h2 class="text-3xl font-black text-indigo-400">RONDE AFGELOPEN!</h2>
                <p class="text-slate-400 text-sm font-semibold mt-1">Resultaat voor Team {activeTeam}</p>
              </div>

              <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 my-auto space-y-4">
                <div class="grid grid-cols-3 gap-2 border-b border-slate-700 pb-4 text-center">
                  <div>
                    <span class="text-xs text-slate-400 block font-bold">Geraden</span>
                    <span class="text-2xl font-black text-emerald-400">{checkedWords.filter(Boolean).length}</span>
                  </div>
                  <div>
                    <span class="text-xs text-slate-400 block font-bold">Handicap</span>
                    <span class="text-2xl font-black text-rose-400">-{wheelHandicap}</span>
                  </div>
                  <div>
                    <span class="text-xs text-slate-400 block font-bold">Punten</span>
                    <span class="text-2xl font-black text-amber-400">
                      +{Math.max(0, checkedWords.filter(Boolean).length - wheelHandicap)}
                    </span>
                  </div>
                </div>

                {/* Totale Stand */}
                <div>
                  <span class="text-xs text-slate-400 font-bold uppercase tracking-wider block mb-2">Totale Tussenstand</span>
                  <div class="grid grid-cols-2 gap-3">
                    <div class={`p-3 rounded-xl border ${activeTeam === 1 ? 'bg-indigo-950/60 border-indigo-500' : 'bg-slate-900 border-slate-800'}`}>
                      <span class="text-xs text-slate-400 font-bold block">TEAM 1</span>
                      <span class="text-3xl font-black text-indigo-400">{team1Score}</span>
                    </div>
                    <div class={`p-3 rounded-xl border ${activeTeam === 2 ? 'bg-pink-950/60 border-pink-500' : 'bg-slate-900 border-slate-800'}`}>
                      <span class="text-xs text-slate-400 font-bold block">TEAM 2</span>
                      <span class="text-3xl font-black text-pink-400">{team2Score}</span>
                    </div>
                  </div>
                </div>
              </div>

              <button 
                onClick={nextTurn}
                class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-black py-4 rounded-xl text-xl shadow-lg active:scale-95 transition-all"
              >
                VOLGENDE BEURT (TEAM {activeTeam === 1 ? 2 : 1}) ➔
              </button>
            </div>
          )}

          {/* ==================== SELECTIESCHERM MODAL ==================== */}
          {isModalOpen && (
            <div class="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div class="bg-slate-800 border border-slate-700 w-full max-w-sm rounded-2xl p-5 shadow-2xl flex flex-col max-h-[85vh]">
                
                <div class="flex justify-between items-center mb-4 pb-2 border-b border-slate-700">
                  <h3 class="text-lg font-bold text-white">Selecteer Woordenlijsten</h3>
                  <button onClick={() => setIsModalOpen(false)} class="text-slate-400 hover:text-white text-xl font-bold p-1">
                    ✕
                  </button>
                </div>

                <div class="flex gap-2 mb-4">
                  <button onClick={selectAll} class="flex-1 bg-slate-700 hover:bg-slate-600 text-xs font-semibold py-1.5 px-2 rounded-lg text-slate-200 border border-slate-600">
                    Alles selecteren
                  </button>
                  <button onClick={selectNone} class="flex-1 bg-slate-700 hover:bg-slate-600 text-xs font-semibold py-1.5 px-2 rounded-lg text-slate-200 border border-slate-600">
                    Wissen
                  </button>
                </div>

                <div class="overflow-y-auto space-y-2 pr-1 my-2 flex-1">
                  {manifest && manifest.files.map((item) => {
                    const isChecked = selectedCategoryIds.includes(item.id);
                    const wordCount = wordPools[item.id] ? wordPools[item.id].length : 0;

                    return (
                      <label 
                        key={item.id}
                        onClick={() => toggleCategory(item.id)}
                        class={`flex items-center justify-between p-3 rounded-xl border cursor-pointer transition-all ${
                          isChecked 
                            ? "bg-indigo-950/60 border-indigo-500 text-white" 
                            : "bg-slate-900/40 border-slate-700/60 text-slate-400 hover:border-slate-600"
                        }`}
                      >
                        <div class="flex items-center gap-3">
                          <input 
                            type="checkbox" 
                            checked={isChecked}
                            onChange={() => {}} 
                            class="w-5 h-5 accent-indigo-500 rounded cursor-pointer"
                          />
                          <span class="font-semibold text-sm">{item.name}</span>
                        </div>
                        <span class="text-xs bg-slate-800 text-slate-400 px-2 py-0.5 rounded-md border border-slate-700">
                          {wordCount} woorden
                        </span>
                      </label>
                    );
                  })}
                </div>

                <button 
                  onClick={() => setIsModalOpen(false)}
                  class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 rounded-xl mt-4 shadow-lg active:scale-95 transition-all"
                >
                  OK / OPSLAAN
                </button>

              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
